name: AI Video Experiment
on:
  workflow_dispatch:
  schedule:
    - cron: "30 5 * * *" # 11:00 AM IST

permissions:
  contents: write

jobs:
  generate-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Generate AI Video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python main_ai.py

      - name: Send Video to Telegram
        uses: PonomarevDA/telegram-upload@v1
        with:
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          files: output/ai-experiment-*.mp4
          message: "🎨 New AI Science Video generated!"

      - name: Upload AI Video
        uses: actions/upload-artifact@v4
        with:
          name: ai-experiment-video
          path: |
            output/ai-experiment-*.mp4
            output/story-*.json
          retention-days: 7

      - name: Commit topic history
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add topic_history.json
          git commit -m "Update AI topic history [skip ci]" || exit 0
          git push

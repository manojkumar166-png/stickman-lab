name: AI Video Experiment

on:
  workflow_dispatch:
  schedule:
    - cron: "30 5,9,13 * * *" # 11:00 AM, 3:00 PM, 7:00 PM IST

permissions:
  contents: write
concurrency:
  group: stickman-lab-main-writer
  cancel-in-progress: false

jobs:
  generate-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
      - name: Restore Cloudflare image progress
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          if git fetch origin ai-image-progress; then
            git archive origin/ai-image-progress progress | tar -x -C .
            if [[ -d progress ]]; then cp -a progress/. output/; fi
          else
            echo "No saved image progress branch yet."
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Cache Whisper model
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/huggingface
          key: whisper-small-${{ runner.os }}-v1
      - name: Install FFmpeg and subtitle fonts
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if sudo apt-get update; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 10))
          done
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --retries 5 --timeout 60 -r requirements.txt
          python -m pip install --retries 5 --timeout 60 faster-whisper
      - name: Generate AI Video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python main_ai.py

      - name: Generate and burn karaoke subtitles
        env:
          HF_HOME: ${{ runner.temp }}/huggingface
        shell: bash
        run: |
          set -euo pipefail
          TODAY="$(date +%F)"
          AUDIO="output/narration-$TODAY.mp3"
          VIDEO="$(find output -maxdepth 1 -type f -name "*-$TODAY.mp4" -print -quit)"
          test -f "$AUDIO" || { echo "Narration file not found: $AUDIO"; exit 1; }
          test -n "$VIDEO" && test -f "$VIDEO" || { echo "Today's generated MP4 was not found."; exit 1; }
          CAPTIONS="output/karaoke-captions-$TODAY.ass"
          SUBTITLED="output/subtitled-$TODAY.mp4"
          python - "$AUDIO" "$CAPTIONS" <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path("science-channel/scripts").resolve()))
          from karaoke_subtitles import generate_karaoke_ass
          import json
          config = json.loads(Path("config.json").read_text(encoding="utf-8"))
          count = generate_karaoke_ass(sys.argv[1], sys.argv[2], int(config["width"]), int(config["height"]))
          print(f"Generated karaoke captions for {count} timed words.")
          PY
          ffmpeg -y -hide_banner -loglevel error -i "$VIDEO" \
            -vf "subtitles=$CAPTIONS:fontsdir=/usr/share/fonts/truetype/dejavu" \
            -map 0:v:0 -map 0:a:0 -c:v libx264 -preset veryfast -crf 21 \
            -c:a copy -shortest -movflags +faststart "$SUBTITLED"
          mv "$SUBTITLED" "$VIDEO"
          rm -f "$CAPTIONS"
          echo "Karaoke subtitles burned into $VIDEO"

      - name: Get Video Topic
        id: get_topic
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob, json, os, re
          from pathlib import Path
          files = sorted(glob.glob("output/story-*.json"))
          if not files:
              raise SystemExit("No generated story JSON was found.")
          with open(files[-1], encoding="utf-8") as handle:
              topic = str(json.load(handle).get("topic", "")).strip()
          if not topic:
              raise SystemExit("Generated story has no topic.")
          filename = re.sub(r'[<>:"/\\|?*\r\n]', "", topic)
          filename = re.sub(r"\s+", " ", filename).strip().rstrip(".")[:120].rstrip(".")
          if not filename or filename in {".", ".."}:
              raise SystemExit("Could not make a safe MP4 filename from the topic.")
          filename += ".mp4"
          today = __import__("datetime").date.today().isoformat()
          candidates = [p for p in Path("output").glob(f"*-{today}.mp4") if p.name != filename]
          if len(candidates) != 1:
              raise SystemExit(f"Expected exactly one generated video for {today}; found {len(candidates)}.")
          candidates[0].replace(Path("output") / filename)
          display_topic = " ".join(topic.split())
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"topic={display_topic}\n")
              output.write(f"filename={filename}\n")
          PY

      - name: Upload AI Video
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ai-topic-video
          path: output/${{ steps.get_topic.outputs.filename }}
          if-no-files-found: error
          retention-days: 7

      - name: Send Video to Telegram
        continue-on-error: true
        uses: PonomarevDA/telegram-upload@b6a8f85231f9a39d652fa1cc64f8557e0a6519ea # v1
        with:
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          files: output/${{ steps.get_topic.outputs.filename }}
          message: "🎨 AI Video Experiment — created by workflow: AI Video Experiment\nTopic: ${{ steps.get_topic.outputs.topic }}"

      - name: Commit topic history safely to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add topic_history.json
          if git diff --cached --quiet; then
            echo "No topic history changes to commit."
            exit 0
          fi
          git commit -m "Update AI topic history [skip ci]"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:refs/heads/main; then
              echo "Topic history published."
              exit 0
            fi
            echo "Push attempt $attempt failed."
            if [ "$attempt" -lt 5 ]; then sleep $((attempt * 3)); fi
          done
          echo "Could not publish topic history after 5 attempts."
          exit 1
      - name: Preserve generated images for failed runs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ai-video-scene-images-failed-run
          path: output/*-gemini/images/
          if-no-files-found: ignore
          retention-days: 1
          compression-level: 0

      - name: Delete generated images after successful run
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          for image_dir in output/*-gemini/images; do
            if [[ -d "$image_dir" ]]; then
              rm -rf -- "$image_dir"
              echo "Deleted generated scene images: $image_dir"
            fi
          done

      - name: Save Cloudflare image progress
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/progress-worktree"
          git fetch origin ai-image-progress || true
          if git show-ref --verify --quiet refs/remotes/origin/ai-image-progress; then
            git worktree add -B ai-image-progress "$RUNNER_TEMP/progress-worktree" origin/ai-image-progress
          else
            git worktree add --detach "$RUNNER_TEMP/progress-worktree" HEAD
            git -C "$RUNNER_TEMP/progress-worktree" switch --orphan ai-image-progress
            git -C "$RUNNER_TEMP/progress-worktree" rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p "$RUNNER_TEMP/progress-worktree/progress"
          find output -maxdepth 1 -type f -name 'story-*.json' -exec cp {} "$RUNNER_TEMP/progress-worktree/progress/" \;
          find output -maxdepth 1 -type d -name 'scenes-*' -exec cp -a {} "$RUNNER_TEMP/progress-worktree/progress/" \;
          git -C "$RUNNER_TEMP/progress-worktree" add -A progress
          if ! git -C "$RUNNER_TEMP/progress-worktree" diff --cached --quiet; then
            git -C "$RUNNER_TEMP/progress-worktree" -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Checkpoint Cloudflare scene generation"
            git -C "$RUNNER_TEMP/progress-worktree" push origin HEAD:refs/heads/ai-image-progress
          else
            echo "No new progress to save."
          fi
      - name: Alert Telegram when workflow fails
        if: failure()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WORKFLOW_NAME: ${{ github.workflow }}
          JOB_NAME: ${{ github.job }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${TELEGRAM_BOT_TOKEN:-}" || -z "${TELEGRAM_CHAT_ID:-}" ]]; then
            echo "Telegram alert skipped: TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID is not configured."
            exit 0
          fi
          MESSAGE="$(printf '%s\n' '🚨 GitHub Actions workflow failed' "Workflow: $WORKFLOW_NAME" "Job: $JOB_NAME" "Branch: $BRANCH_NAME" "Run: #$RUN_NUMBER" "$RUN_URL")"
          curl --fail --silent --show-error \
            --connect-timeout 15 --max-time 30 \
            --retry 3 --retry-all-errors --retry-delay 2 \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}"

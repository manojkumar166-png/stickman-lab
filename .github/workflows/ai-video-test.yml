name: AI Video Experiment

on:
  workflow_dispatch:
  schedule:
    - cron: "30 5 * * *" # 11:00 AM IST

permissions:
  contents: write
concurrency:
  group: ai-video-main-writer
  cancel-in-progress: false

jobs:
  generate-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install FFmpeg
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if sudo apt-get update; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 10))
          done
          sudo apt-get install -y ffmpeg
      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --retries 5 --timeout 60 -r requirements.txt
      - name: Generate AI Video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python main_ai.py

      - name: Get Video Topic
        id: get_topic
        run: |
          python - <<'PY'
          import glob, json, os
          files = sorted(glob.glob("output/story-*.json"))
          if not files:
              raise SystemExit("No generated story JSON was found.")
          with open(files[-1], encoding="utf-8") as handle:
              topic = str(json.load(handle).get("topic", "")).strip()
          if not topic:
              raise SystemExit("Generated story has no topic.")
          delimiter = "TOPIC_EOF"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"topic<<{delimiter}\n{topic}\n{delimiter}\n")

      - name: Upload AI Video
        uses: actions/upload-artifact@v4
        with:
          name: ai-experiment-video
          path: |
            output/ai-experiment-*.mp4
            output/story-*.json
          if-no-files-found: error
          retention-days: 7

      - name: Send Video to Telegram
        continue-on-error: true
        uses: PonomarevDA/telegram-upload@v1
        with:
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          files: output/ai-experiment-*.mp4
          message: "🎨 New AI Science Video: ${{ steps.get_topic.outputs.topic }}"

      - name: Commit topic history safely to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add topic_history.json
          if git diff --cached --quiet; then
            echo "No topic history changes to commit."
            exit 0
          fi
          git commit -m "Update AI topic history [skip ci]"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:refs/heads/main; then
              echo "Topic history published."
              exit 0
            fi
            echo "Push attempt $attempt failed."
            if [ "$attempt" -lt 5 ]; then sleep $((attempt * 3)); fi
          done
          echo "Could not publish topic history after 5 attempts."
          exit 1
      - name: Alert Telegram when workflow fails
        if: failure()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WORKFLOW_NAME: ${{ github.workflow }}
          JOB_NAME: ${{ github.job }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${TELEGRAM_BOT_TOKEN:-}" || -z "${TELEGRAM_CHAT_ID:-}" ]]; then
            echo "Telegram alert skipped: TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID is not configured."
            exit 0
          fi
          MESSAGE="$(printf '%s\n' '🚨 GitHub Actions workflow failed' "Workflow: $WORKFLOW_NAME" "Job: $JOB_NAME" "Branch: $BRANCH_NAME" "Run: #$RUN_NUMBER" "$RUN_URL")"
          curl --fail --silent --show-error \
            --connect-timeout 15 --max-time 30 \
            --retry 3 --retry-all-errors --retry-delay 2 \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}"

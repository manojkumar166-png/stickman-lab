name: AI Video Experiment
on:
  workflow_dispatch: # This means it ONLY runs when you click the button manually

permissions:
  contents: read

jobs:
  generate-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt && pip install aiohttp
      - name: Generate AI Video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main_ai.py
      - name: Upload AI Video
        uses: actions/upload-artifact@v4
        with:
          name: ai-experiment-video
          path: |
            output/ai-experiment-*.mp4
            output/story-*.json
          retention-days: 7
name: AI Video Experiment

on:
  workflow_dispatch:
  schedule:
    - cron: "30 5 * * *" # 11:00 AM IST

permissions:
  contents: write

jobs:
  generate-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg 7 shared libraries for TorchCodec
        shell: bash
        run: |
          set -euo pipefail
          curl -Ls https://micro.mamba.pm/api/micromamba/linux-64/latest | tar -xj bin/micromamba
          ./bin/micromamba create -y -p "$RUNNER_TEMP/ffmpeg7" -c conda-forge "ffmpeg=7.1.1"
          echo "$RUNNER_TEMP/ffmpeg7/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/ffmpeg7/lib:\${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Install WhisperX and faster-whisper subtitle backends
        run: python -m pip install --retries 5 --timeout 60 whisperx faster-whisper
      - name: Pin TorchCodec for PyTorch 2.8 and verify audio decoding
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --retries 5 --timeout 60 --force-reinstall --no-deps "torchcodec==0.7.0"
          python - <<'PY'
          import subprocess
          import tempfile
          from pathlib import Path
          import torch
          from torchcodec.decoders import AudioDecoder

          print("PyTorch:", torch.__version__)
          with tempfile.TemporaryDirectory() as directory:
              sample = Path(directory) / "torchcodec-smoke-test.wav"
              subprocess.run([
                  "ffmpeg", "-y", "-v", "error", "-f", "lavfi",
                  "-i", "sine=frequency=440:duration=1", "-c:a", "pcm_s16le",
                  str(sample),
              ], check=True)
              decoded = AudioDecoder(str(sample)).get_all_samples()
              assert decoded.data.numel() > 0, "TorchCodec decoded no audio samples"
              print("TorchCodec audio decode OK:", tuple(decoded.data.shape))
          PY
      - name: Install Chatterbox (only when private reference URL is configured)
        env:
          CHATTERBOX_REFERENCE_AUDIO_URL: ${{ secrets.CHATTERBOX_REFERENCE_AUDIO_URL }}
        run: |
          if [ -n "$CHATTERBOX_REFERENCE_AUDIO_URL" ]; then
            pip install chatterbox-tts
          else
            echo "No private voice reference configured; skipping Chatterbox installation."
          fi
      - name: Generate AI Video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CHATTERBOX_REFERENCE_AUDIO_URL: ${{ secrets.CHATTERBOX_REFERENCE_AUDIO_URL }}
        run: python main_ai.py

      - name: Get Video Topic
        id: get_topic
        run: |
          TOPIC=$(python -c "import json,glob; print(json.load(open(glob.glob('output/story-*.json')[0]))['topic'])")
          echo "topic_name=$TOPIC" >> $GITHUB_OUTPUT

      - name: Send Video to Telegram
        uses: PonomarevDA/telegram-upload@v1
        with:
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          files: output/ai-experiment-*.mp4
          message: "🎨 New AI Science Video: ${{ steps.get_topic.outputs.topic_name }}"

      - name: Upload AI Video
        uses: actions/upload-artifact@v4
        with:
          name: ai-experiment-video
          path: |
            output/ai-experiment-*.mp4
            output/story-*.json
          retention-days: 2
      - name: Commit topic history
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add topic_history.json
          git commit -m "Update AI topic history [skip ci]" || exit 0
          git pull --rebase origin main
          git push

name: AI Video Experiment

on:
  workflow_dispatch:
  schedule:
    - cron: "30 5 * * *" # Once daily at 11:00 AM IST

permissions:
  contents: write
  actions: write
concurrency:
  group: stickman-lab-main-writer
  cancel-in-progress: false

jobs:
  generate-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Restore Cloudflare image progress
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          REMOTE_PROGRESS="$(git ls-remote --heads origin refs/heads/ai-image-progress)"
          if [[ -n "$REMOTE_PROGRESS" ]]; then
            git fetch origin +refs/heads/ai-image-progress:refs/remotes/origin/ai-image-progress
            git archive origin/ai-image-progress progress | tar -x -C .
            if [[ -d progress ]]; then cp -a progress/. output/; fi
            rm -rf progress
            echo "Restored the saved Cloudflare image checkpoint."
          else
            echo "No saved image progress branch yet."
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Cache Whisper model
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/huggingface
          key: whisper-small-${{ runner.os }}-v1
      - name: Install FFmpeg and subtitle fonts
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if sudo apt-get update; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 10))
          done
          for attempt in 1 2 3; do
            if sudo apt-get install -y ffmpeg fonts-dejavu-core; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 10))
          done
      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python -m pip install --retries 5 --timeout 60 --upgrade pip
          python -m pip install --retries 5 --timeout 60 -r requirements.txt
          python -m pip install --retries 5 --timeout 60 faster-whisper
      - name: Generate AI Video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python main_ai.py

      - name: Generate and burn karaoke subtitles
        env:
          HF_HOME: ${{ runner.temp }}/huggingface
        shell: bash
        run: |
          set -euo pipefail
          TODAY="$(date +%F)"
          AUDIO="output/narration-$TODAY.mp3"
          VIDEO="$(python - "$TODAY" <<'PY'
          import sys
          from pathlib import Path
          day = sys.argv[1]
          files = [p for p in Path("output").glob(f"*-{day}.mp4") if p.is_file()]
          print(max(files, key=lambda p: p.stat().st_mtime_ns) if files else "")
          PY
          )"
          test -f "$AUDIO" || { echo "Narration file not found: $AUDIO"; exit 1; }
          test -n "$VIDEO" && test -f "$VIDEO" || { echo "Today's generated MP4 was not found."; exit 1; }
          CAPTIONS="output/karaoke-captions-$TODAY.ass"
          SUBTITLED="output/subtitled-$TODAY.mp4"
          python - "$AUDIO" "$CAPTIONS" <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path("science-channel/scripts").resolve()))
          from karaoke_subtitles import generate_karaoke_ass
          import json
          config = json.loads(Path("config.json").read_text(encoding="utf-8"))
          count = generate_karaoke_ass(sys.argv[1], sys.argv[2], int(config["width"]), int(config["height"]))
          print(f"Generated karaoke captions for {count} timed words.")
          PY
          run_ffmpeg_with_fallback() {
            local attempt
            for attempt in 1 2 3; do
              if ffmpeg "$@"; then return 0; fi
              echo "Subtitle FFmpeg attempt $attempt/3 failed."
              if [ "$attempt" -lt 3 ]; then sleep $((attempt * 5)); fi
            done
            local -a fallback=()
            local skip_next=0
            for arg in "$@"; do
              if [ "$skip_next" -eq 1 ]; then skip_next=0; continue; fi
              case "$arg" in
                -preset|-crf) skip_next=1 ;;
                libx264) fallback+=(mpeg4 -q:v 5) ;;
                *) fallback+=("$arg") ;;
              esac
            done
            echo "H.264 subtitle encoding failed; trying FFmpeg MPEG-4 fallback."
            ffmpeg "${fallback[@]}"
          }
          run_ffmpeg_with_fallback -y -hide_banner -loglevel error -i "$VIDEO" \
            -vf "subtitles=$CAPTIONS:fontsdir=/usr/share/fonts/truetype/dejavu" \
            -map 0:v:0 -map 0:a:0 -c:v libx264 -preset veryfast -crf 21 \
            -c:a copy -shortest -movflags +faststart "$SUBTITLED"
          mv "$SUBTITLED" "$VIDEO"
          rm -f "$CAPTIONS"
          echo "Karaoke subtitles burned into $VIDEO"

      - name: Record topic after successful video generation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob, json
          from pathlib import Path
          from scripts.generate_story import _is_repeat

          files = [Path(p) for p in glob.glob("output/story-*.json") if Path(p).is_file()]
          if not files:
              raise SystemExit("Cannot record topic: no story JSON found.")
          latest = max(files, key=lambda p: p.stat().st_mtime_ns)
          story = json.loads(latest.read_text(encoding="utf-8"))
          topic = str(story.get("topic", "")).strip()
          if not topic:
              raise SystemExit("Cannot record topic: story has no topic.")
          history_path = Path("topic_history.json")
          history = json.loads(history_path.read_text(encoding="utf-8")) if history_path.exists() else []
          if not isinstance(history, list):
              raise SystemExit("Topic history must be a JSON list; refusing to overwrite it.")
          if _is_repeat(topic, history):
              print(f"Topic already present in history: {topic}")
          else:
              history.append(topic)
              temporary = history_path.with_suffix(".json.tmp")
              temporary.write_text(json.dumps(history[-200:], ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
              temporary.replace(history_path)
              print(f"Recorded successfully generated video topic: {topic}")
          PY

      - name: Get Video Topic
        id: get_topic
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob, json, os, re
          from pathlib import Path
          files = [Path(p) for p in glob.glob("output/story-*.json") if Path(p).is_file()]
          if not files:
              raise SystemExit("No generated story JSON was found.")
          latest = max(files, key=lambda p: p.stat().st_mtime_ns)
          with latest.open(encoding="utf-8") as handle:
              topic = str(json.load(handle).get("topic", "")).strip()
          if not topic:
              raise SystemExit("Generated story has no topic.")
          filename = re.sub(r'[<>:"/\\|?*\r\n]', "", topic)
          filename = re.sub(r"\s+", " ", filename).strip().rstrip(".")[:120].rstrip(".")
          if not filename or filename in {".", ".."}:
              raise SystemExit("Could not make a safe MP4 filename from the topic.")
          filename += ".mp4"
          today = __import__("datetime").date.today().isoformat()
          candidates = [p for p in Path("output").glob(f"*-{today}.mp4") if p.is_file() and p.name != filename]
          if not candidates:
              raise SystemExit(f"No dated generated video was found for {today}.")
          # A manual rerun on the same day may leave older dated MP4s behind.
          # Rename only the newest output from this run.
          newest_video = max(candidates, key=lambda p: p.stat().st_mtime_ns)
          newest_video.replace(Path("output") / filename)
          display_topic = " ".join(topic.split())
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"topic={display_topic}\n")
              output.write(f"filename={filename}\n")
          PY

      - name: Upload AI Video
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ai-topic-video
          path: output/${{ steps.get_topic.outputs.filename }}
          if-no-files-found: error
          retention-days: 2

      - name: Commit topic history safely to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add topic_history.json
          if git diff --cached --quiet; then
            echo "No topic history changes to commit."
            exit 0
          fi
          git commit -m "Update AI topic history [skip ci]"
          for attempt in 1 2 3 4 5; do
            if ! git fetch origin main; then
              echo "Fetch attempt $attempt failed; retrying."
              if [ "$attempt" -lt 5 ]; then sleep $((attempt * 3)); fi
              continue
            fi
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Rebase conflict; refusing to overwrite concurrent main-branch changes."
              exit 1
            fi
            if git push origin HEAD:refs/heads/main; then
              echo "Topic history published."
              exit 0
            fi
            echo "Push attempt $attempt failed."
            if [ "$attempt" -lt 5 ]; then sleep $((attempt * 3)); fi
          done
          echo "Could not publish topic history after 5 attempts."
          exit 1
      - name: Send Video to Telegram
        id: telegram
        continue-on-error: true
        uses: PonomarevDA/telegram-upload@b6a8f85231f9a39d652fa1cc64f8557e0a6519ea # v1
        with:
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          files: output/${{ steps.get_topic.outputs.filename }}
          message: "🎨 AI Video Experiment — created by workflow: AI Video Experiment\nTopic: ${{ steps.get_topic.outputs.topic }}"

      - name: Require successful Telegram delivery
        if: steps.telegram.outcome != 'success'
        shell: bash
        run: |
          echo "::error::The video artifact was created, but Telegram delivery failed. Existing scene/story progress will be preserved for a safe retry."
          exit 1
      - name: Mark AI story completed after delivery and history commit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob, json, os
          from pathlib import Path
          files = [Path(p) for p in glob.glob("output/story-*.json") if Path(p).is_file()]
          if not files:
              raise SystemExit("Cannot mark story complete: no story JSON found.")
          story_path = max(files, key=lambda p: p.stat().st_mtime_ns)
          story = json.loads(story_path.read_text(encoding="utf-8"))
          story["completed"] = True
          temporary = story_path.with_name(story_path.name + ".tmp")
          temporary.write_text(json.dumps(story, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          os.replace(temporary, story_path)
          print(f"Marked delivered story complete: {story_path}")
          PY

      - name: Clear saved progress after successful run
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_PROGRESS="$(git ls-remote --heads origin refs/heads/ai-image-progress)"
          if [[ -z "$REMOTE_PROGRESS" ]]; then
            echo "No saved checkpoint to clear."
            exit 0
          fi
          for attempt in 1 2 3; do
            if git push origin --delete ai-image-progress; then
              echo "Cleared completed-run checkpoint."
              exit 0
            fi
            echo "Checkpoint cleanup attempt $attempt failed."
            sleep $((attempt * 3))
          done
          echo "::error::Could not clear the completed checkpoint after three attempts; saving the completed state before retrying."
          exit 1

      - name: Save failed-run progress to ai-image-progress
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          CHECKPOINT_DIR="$RUNNER_TEMP/ai-image-progress"
          rm -rf "$CHECKPOINT_DIR"
          mkdir -p "$CHECKPOINT_DIR"
          if [[ -d output ]]; then cp -a output/. "$CHECKPOINT_DIR"/; fi
          git checkout --orphan ai-image-progress
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p progress
          cp -a "$CHECKPOINT_DIR"/. progress/
          git add progress
          if git diff --cached --quiet; then
            echo "No progress files to save."
            exit 0
          fi
          git commit -m "Save AI video experiment progress"
          for attempt in 1 2 3 4 5; do
            if git push --force origin HEAD:refs/heads/ai-image-progress; then
              echo "Cloudflare image checkpoint saved."
              exit 0
            fi
            echo "Checkpoint push attempt $attempt failed."
            if [ "$attempt" -lt 5 ]; then sleep $((attempt * 3)); fi
          done
          echo "Could not save Cloudflare image checkpoint after five attempts."
          exit 1

      - name: Preserve generated images for failed runs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ai-video-scene-images-failed-run
          path: output/*-gemini/images/
          if-no-files-found: ignore
          retention-days: 1
          compression-level: 0

      - name: Retry failed workflow run
        if: failure() && fromJSON(github.run_attempt) < 3
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Workflow attempt ${GITHUB_RUN_ATTEMPT} failed. Requesting retry; maximum total attempts: 3."
          gh run rerun "${GITHUB_RUN_ID}" --failed --repo "${GITHUB_REPOSITORY}"
      - name: Alert Telegram when workflow fails
        if: failure()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WORKFLOW_NAME: ${{ github.workflow }}
          JOB_NAME: ${{ github.job }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${TELEGRAM_BOT_TOKEN:-}" || -z "${TELEGRAM_CHAT_ID:-}" ]]; then
            echo "Telegram alert skipped: TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID is not configured."
            exit 0
          fi
          MESSAGE="$(printf '%s\n' '🚨 GitHub Actions workflow failed' "Workflow: $WORKFLOW_NAME" "Job: $JOB_NAME" "Branch: $BRANCH_NAME" "Run: #$RUN_NUMBER" "$RUN_URL")"
          curl --fail --silent --show-error \
            --connect-timeout 15 --max-time 30 \
            --retry 3 --retry-all-errors --retry-delay 2 \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}"

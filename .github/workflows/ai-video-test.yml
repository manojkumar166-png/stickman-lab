name: AI Video Experiment
on:
  workflow_dispatch: # Keeps the manual button
  schedule:
    # Runs every day at 05:30 UTC (11:00 AM India Time)
    - cron: "30 5 * * *"

permissions:
  contents: read

jobs:
  generate-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Generate AI Video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python main_ai.py
      - name: Upload AI Video
        uses: actions/upload-artifact@v4
        with:
          name: ai-experiment-video
          path: |
            output/ai-experiment-*.mp4
            output/story-*.json
          retention-days: 7
name: Telegram Image Receiver
on:
  push:
    branches: [main]
    paths:
      - ".github/telegram-inbox/**"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: stickman-lab-main-writer
  cancel-in-progress: false
jobs:
  receive:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SCIENCE_BRANCH: main
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install receiver dependency
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --retries 5 --timeout 60 requests
      - name: Receive Telegram images for main branch episodes only
        id: process
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -u science-channel/scripts/telegram_image_receiver.py
      - name: Commit received images and receiver state to main
        id: publish
        env:
          COMPLETED_EPISODES: ${{ steps.process.outputs.completed_episodes }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add science-channel/daily-episodes/ science-channel/telegram-bot-state.json
          git add -A .github/telegram-inbox/
          if git diff --cached --quiet; then
            echo "No new Telegram files or state changes."
            exit 0
          fi
          git commit -m "Receive science episode images from Telegram"
          for attempt in 1 2 3 4 5; do
            if ! git fetch origin main; then
              echo "Fetch attempt $attempt failed; retrying."
              if [ "$attempt" -lt 5 ]; then sleep $((attempt * 3)); fi
              continue
            fi
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Rebase conflict; refusing to overwrite concurrent main-branch changes."
              exit 1
            fi
            if git push origin HEAD:refs/heads/main; then
              echo "Telegram uploads committed to main."
              git fetch origin main
              mapfile -t COMPLETED < <(printf '%s\n' "$COMPLETED_EPISODES" | sed '/^$/d')
              if [ "${#COMPLETED[@]}" -gt 1 ]; then
                echo "This receiver batch completed multiple episodes. To avoid GitHub concurrency replacing a pending render, run the renderer manually for each:"
                printf ' - %s\n' "${COMPLETED[@]}"
                exit 1
              fi
              if [ "${#COMPLETED[@]}" -eq 1 ]; then
                EPISODE_PATH="${COMPLETED[0]}"
                if [[ "$EPISODE_PATH" =~ ^science-channel/daily-episodes/[0-9]{4}-[0-9]{2}-[0-9]{2}/episode-[A-Za-z0-9][A-Za-z0-9._-]*$ ]] && git cat-file -e "origin/main:$EPISODE_PATH/READY.txt" 2>/dev/null; then
                  echo "episode_path=$EPISODE_PATH" >> "$GITHUB_OUTPUT"
                else
                  echo "Completed episode path was invalid or READY.txt was not committed: $EPISODE_PATH"
                  exit 1
                fi
              else
                echo "No newly completed READY episode was published; renderer dispatch is not needed."
              fi
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying."
            if [ "$attempt" -lt 5 ]; then sleep $((attempt * 3)); fi
          done
          echo "Could not publish received images to main after 5 attempts."
          exit 1
      - name: Start renderer for the newly completed Telegram episode
        if: steps.publish.outputs.episode_path != ''
        env:
          GH_TOKEN: ${{ github.token }}
          EPISODE_PATH: ${{ steps.publish.outputs.episode_path }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if gh workflow run free-science-visuals.yml --ref main -f "episode_path=$EPISODE_PATH"; then
              echo "Dispatched the renderer for $EPISODE_PATH."
              exit 0
            fi
            echo "Renderer dispatch attempt $attempt failed."
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 5)); fi
          done
          echo "Could not dispatch the renderer. The episode and READY marker are safely committed to main; run free-science-visuals.yml manually."
          exit 1
      - name: Alert Telegram when workflow fails
        if: failure()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WORKFLOW_NAME: ${{ github.workflow }}
          JOB_NAME: ${{ github.job }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${TELEGRAM_BOT_TOKEN:-}" || -z "${TELEGRAM_CHAT_ID:-}" ]]; then
            echo "Telegram alert skipped: TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID is not configured."
            exit 0
          fi
          MESSAGE="$(printf '%s\n' '🚨 GitHub Actions workflow failed' "Workflow: $WORKFLOW_NAME" "Job: $JOB_NAME" "Branch: $BRANCH_NAME" "Run: #$RUN_NUMBER" "$RUN_URL")"
          curl --fail --silent --show-error \
            --connect-timeout 15 --max-time 30 \
            --retry 3 --retry-all-errors --retry-delay 2 \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}"

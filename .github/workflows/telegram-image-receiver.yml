name: Telegram Image Receiver
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: telegram-image-receiver
  cancel-in-progress: false
jobs:
  receive:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SCIENCE_BRANCH: adaptive-cinematic-effects
    steps:
      - uses: actions/checkout@v4
        with:
          ref: adaptive-cinematic-effects
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install receiver dependency
        run: python -m pip install requests
      - name: Receive Telegram images
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python science-channel/scripts/telegram_image_receiver.py
      - name: Commit received images and receiver state to adaptive branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add science-channel/daily-episodes/ science-channel/telegram-bot-state.json
          if git diff --cached --quiet; then
            echo "No new Telegram files or state changes."
            exit 0
          fi
          git commit -m "Receive science episode images from Telegram"
          for attempt in 1 2 3; do
            git fetch origin "$SCIENCE_BRANCH"
            git rebase "origin/$SCIENCE_BRANCH"
            if git push origin "HEAD:refs/heads/$SCIENCE_BRANCH"; then
              echo "Telegram uploads committed to $SCIENCE_BRANCH."
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying."
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 3)); fi
          done
          echo "Could not publish received images after 3 attempts."
          exit 1

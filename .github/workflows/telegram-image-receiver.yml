name: Telegram Image Receiver
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: science-channel-main-writer
  cancel-in-progress: false
jobs:
  receive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SCIENCE_BRANCH: main
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install receiver dependency
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --retries 5 --timeout 60 requests
      - name: Receive Telegram images for main branch episodes only
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -u science-channel/scripts/telegram_image_receiver.py
      - name: Commit received images and receiver state to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add science-channel/daily-episodes/ science-channel/telegram-bot-state.json
          if git diff --cached --quiet; then
            echo "No new Telegram files or state changes."
            exit 0
          fi
          git commit -m "Receive science episode images from Telegram"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:refs/heads/main; then
              echo "Telegram uploads committed to main."
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying."
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 3)); fi
          done
          echo "Could not publish received images to main after 3 attempts."
          exit 1
      - name: Alert Telegram when workflow fails
        if: failure()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WORKFLOW_NAME: ${{ github.workflow }}
          JOB_NAME: ${{ github.job }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${TELEGRAM_BOT_TOKEN:-}" || -z "${TELEGRAM_CHAT_ID:-}" ]]; then
            echo "Telegram alert skipped: TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID is not configured."
            exit 0
          fi
          MESSAGE="🚨 GitHub Actions workflow failed%0AWorkflow: ${WORKFLOW_NAME}%0AJob: ${JOB_NAME}%0ABranch: ${BRANCH_NAME}%0ARun: #${RUN_NUMBER}%0A${RUN_URL}"
          curl --fail --silent --show-error \\
            --connect-timeout 15 --max-time 30 \\
            --retry 3 --retry-all-errors --retry-delay 2 \\
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \\
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \\
            --data-urlencode "text=${MESSAGE}"

name: Free Science Visuals — SVG Storybook
on:
  workflow_dispatch:
  schedule:
    - cron: "30 7 * * *" # 1:00 PM India Standard Time (UTC+5:30)

permissions:
  contents: write

concurrency:
  group: free-science-visuals
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Install Python dependencies and Chromium
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Verify procedural SVG renderer and static video assembly
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/external_image_scene_renderer.py
          test -f scripts/render_video.py
          python - <<'PY'
          from pathlib import Path
          entry = Path("storybook_science_video.py").read_text(encoding="utf-8")
          renderer = Path("scripts/external_image_scene_renderer.py").read_text(encoding="utf-8")
          assembler = Path("scripts/render_video.py").read_text(encoding="utf-8")
          assert "render_external_scenes" in entry
          assert "download_scene_illustrations" not in entry
          assert "def _illustration" in renderer and "<svg" in renderer
          assert "page.screenshot" in renderer
          assert "ffmpeg" in assembler.lower()
          assert "zoompan" not in assembler.lower()
          print("Verified: procedural SVG artwork, static scenes, FFmpeg assembly.")
          PY

      - name: Generate science video (procedural SVG artwork; Gemini used for story text only)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONUNBUFFERED: "1"
          TOPIC_HISTORY_FILE: free_topic_history.json
        run: python -u storybook_science_video.py

      - name: Rename final video to the exact topic
        id: artifact
        run: |
          python - <<'PY'
          import glob, json, os, re
          from pathlib import Path
          stories = sorted(glob.glob("output/storybook-science-story-*.json"))
          videos = sorted(glob.glob("output/storybook-science-*.mp4"))
          if len(stories) != 1 or len(videos) != 1:
              raise SystemExit(f"Expected one story JSON and one video; found {len(stories)} stories and {len(videos)} videos")
          topic = str(json.loads(Path(stories[0]).read_text(encoding="utf-8")).get("topic", "")).strip()
          if not topic:
              raise SystemExit("Generated story is missing its topic")
          filename = re.sub(r'[<>:"/\\|?*]', "", topic).strip().rstrip(".")
          if not filename:
              raise SystemExit("Could not create a valid MP4 filename from the topic")
          target = Path("output") / f"{filename}.mp4"
          Path(videos[0]).rename(target)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"filename={target.name}\n")
          PY

      - name: Upload final MP4 only
        uses: actions/upload-artifact@v4
        with:
          name: free-science-public-domain-storybook
          path: output/${{ steps.artifact.outputs.filename }}
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

      - name: Commit this workflow's topic history only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add free_topic_history.json
          git commit -m "Update storybook science topic history [skip ci]" || exit 0
          git push origin HEAD:${GITHUB_REF_NAME}

name: Free Science Visuals — Storybook 2D

on:
  workflow_dispatch:
  schedule:
    - cron: "30 7 * * *" # 1:00 PM India Standard Time (UTC+5:30)

permissions:
  contents: write

concurrency:
  group: free-science-visuals
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate storybook-style 2D science video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONUNBUFFERED: "1"
          TOPIC_HISTORY_FILE: free_topic_history.json
        run: python -u storybook_science_video.py

      - name: Upload video, story, narration, and image credits
        uses: actions/upload-artifact@v4
        with:
          name: free-science-storybook-2d
          path: |
            output/storybook-science-*.mp4
            output/storybook-science-story-*.json
            output/storybook-science-narration-*.mp3
            output/storybook-science-image-credits-*.json
          retention-days: 7
          if-no-files-found: error

      - name: Commit this workflow's topic history only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add free_topic_history.json
          git commit -m "Update free storybook science topic history [skip ci]" || exit 0
          git push origin HEAD:${GITHUB_REF_NAME}

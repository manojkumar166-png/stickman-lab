name: Free Science Visuals — Render Ready Episode
on:
  push:
    branches: [main]
    paths:
      - "science-channel/daily-episodes/**/images/incoming/**"
      - "science-channel/daily-episodes/**/READY.txt"
  workflow_dispatch:
    inputs:
      episode_path:
        description: "Optional exact episode folder (for example science-channel/daily-episodes/2026-10-30/episode-001)"
        required: false
        type: string
        default: ""
permissions:
  contents: write
concurrency:
  group: science-channel-render-main
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade edge-tts
      - name: Resolve exact episode path
        id: episode
        shell: bash
        env:
          MANUAL_EPISODE_PATH: ${{ inputs.episode_path }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            P="$MANUAL_EPISODE_PATH"
            if [ -z "$P" ]; then
              # If no path is supplied, select the newest episode with a READY marker or incoming images.
              P=""
              while IFS= read -r f; do
                candidate="${f%/READY.txt}"
                if [[ "$f" == */images/incoming/* ]]; then
                  candidate="${f%%/images/incoming/*}"
                fi
                if [ -z "$P" ] || [[ "$candidate" > "$P" ]]; then P="$candidate"; fi
              done < <(find science-channel/daily-episodes -type f \( -name READY.txt -o \( -path '*/images/incoming/*' ! -name '.gitkeep' \) \) | sort)
            fi
          else
            git diff-tree --no-commit-id --name-only -r "${{ github.event.before }}" "${{ github.sha }}" > /tmp/changed.txt
            mapfile -t EPISODES < <(grep -E '^science-channel/daily-episodes/.+/(images/incoming/|READY\.txt)' /tmp/changed.txt | sed -E 's#/(images/incoming/.*|READY\.txt)$##' | sort -u)
            if [ "${#EPISODES[@]}" -ne 1 ]; then
              echo "This push must update exactly one episode; found ${#EPISODES[@]}. Upload episodes in separate commits."
              exit 1
            fi
            P="${EPISODES[0]}"
          fi
          case "$P" in science-channel/daily-episodes/*) ;; *) echo "Invalid episode path: $P"; exit 1;; esac
          case "$P" in *".."*) echo "Invalid episode path: traversal is not allowed."; exit 1;; esac
          test -f "$P/episode.json" || { echo "episode.json not found in $P"; exit 1; }
          echo "path=$P" >> "$GITHUB_OUTPUT"
      - name: Validate, narrate and render
        run: python science-channel/scripts/render_episode.py "${{ steps.episode.outputs.path }}"
      - name: Resolve topic-based artifact name
        id: artifact
        env:
          EPISODE_PATH: ${{ steps.episode.outputs.path }}
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          metadata = json.loads((Path(os.environ["EPISODE_PATH"]) / "episode.json").read_text(encoding="utf-8"))
          title = str(metadata.get("title", "")).strip()
          if not title:
              raise SystemExit("episode.json is missing its topic title")
          slug = re.sub(r"[^a-z0-9]+", "-", title.lower()).strip("-")[:80].strip("-")
          if not slug:
              raise SystemExit("Could not create a valid artifact name from the episode title")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"name=science-channel-{slug}\n")
          PY
      - name: Upload rendered outputs
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: |
            ${{ steps.episode.outputs.path }}/output/
          if-no-files-found: error
          retention-days: 2
      - name: Send finished video to Telegram (non-blocking)
        continue-on-error: true
        uses: PonomarevDA/telegram-upload@v1
        with:
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          files: ${{ steps.episode.outputs.path }}/output/*.mp4
          message: "🎬 Episode rendered: ${{ steps.episode.outputs.path }}"
      - name: Delete processed ZIPs from GitHub (API, retrying)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          shopt -s nullglob nocaseglob
          zips=(${{ steps.episode.outputs.path }}/images/incoming/*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "No ZIP archive to remove."
            exit 0
          fi
          for file in "${zips[@]}"; do
            echo "Deleting $file from main..."
            deleted=false
            for attempt in 1 2 3; do
              sha=$(gh api "repos/$GITHUB_REPOSITORY/contents/$file?ref=main" --jq .sha 2>/dev/null || true)
              if [ -z "$sha" ]; then
                echo "$file is already absent from main."
                deleted=true
                break
              fi
              if gh api --method DELETE "repos/$GITHUB_REPOSITORY/contents/$file" \
                -f message="Delete processed image ZIP after render" \
                -f sha="$sha" \
                -f branch=main; then
                deleted=true
                break
              fi
              echo "Delete attempt $attempt failed; retrying..."
              sleep 3
            done
            if [ "$deleted" != true ]; then
              echo "ERROR: Could not delete $file after 3 attempts."
              exit 1
            fi
          done

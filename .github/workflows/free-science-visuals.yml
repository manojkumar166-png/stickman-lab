name: Free Science Visuals — SVG Storybook
on:
  workflow_dispatch:
  schedule:
    - cron: "30 7 * * *" # 1:00 PM India Standard Time (UTC+5:30)

permissions:
  contents: write

concurrency:
  group: free-science-visuals
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Install Python dependencies and Chromium
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Verify procedural SVG renderer and static video assembly
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/external_image_scene_renderer.py
          test -f scripts/render_video.py
          python - <<'PY'
          from pathlib import Path
          entry = Path("storybook_science_video.py").read_text(encoding="utf-8")
          renderer = Path("scripts/external_image_scene_renderer.py").read_text(encoding="utf-8")
          assembler = Path("scripts/render_video.py").read_text(encoding="utf-8")
          assert "render_external_scenes" in entry
          assert "download_scene_illustrations" not in entry
          assert "def _illustration" in renderer and "<svg" in renderer
          assert "page.screenshot" in renderer
          assert "ffmpeg" in assembler.lower()
          assert "zoompan" not in assembler.lower()
          print("Verified: procedural SVG artwork, static scenes, FFmpeg assembly.")
          PY

      - name: Generate science video (procedural SVG artwork; Gemini used for story text only)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONUNBUFFERED: "1"
          TOPIC_HISTORY_FILE: free_topic_history.json
        run: python -u storybook_science_video.py

      - name: Upload video, story, narration, and rendered scenes
        uses: actions/upload-artifact@v4
        with:
          name: free-science-public-domain-storybook
          path: |
            output/storybook-science-*.mp4
            output/storybook-science-story-*.json
            output/storybook-science-narration-*.mp3
            output/storybook-science-source-images-*
            output/storybook-science-scenes-*
          retention-days: 7
          if-no-files-found: error

      - name: Commit this workflow's topic history only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add free_topic_history.json
          git commit -m "Update storybook science topic history [skip ci]" || exit 0
          git push origin HEAD:${GITHUB_REF_NAME}

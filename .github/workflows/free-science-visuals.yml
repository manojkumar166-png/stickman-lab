name: Free Science Visuals — Render Ready Episode
on:
  push:
    branches: [main]
    paths:
      - "science-channel/daily-episodes/**/images/incoming/**"
      - "science-channel/daily-episodes/**/READY.txt"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: science-channel-render-${{ github.sha }}
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade edge-tts
      - name: Resolve exact episode path
        id: episode
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Pick the newest episode that has a READY marker or uploaded incoming images.
            P=""
            while IFS= read -r f; do
              candidate="${f%/READY.txt}"
              if [[ "$f" == */images/incoming/* ]]; then
                candidate="${f%%/images/incoming/*}"
              fi
              if [ -z "$P" ] || [[ "$candidate" > "$P" ]]; then P="$candidate"; fi
            done < <(find science-channel/daily-episodes -type f \( -name READY.txt -o -path '*/images/incoming/*' \) | sort)
          else
            git diff-tree --no-commit-id --name-only -r "${{ github.event.before }}" "${{ github.sha }}" > /tmp/changed.txt
            P=$(grep -E '^science-channel/daily-episodes/.+/(images/incoming/|READY\.txt)' /tmp/changed.txt | head -n 1 | sed -E 's#/(images/incoming/.*|READY\.txt)$##')
          fi
          test -n "$P" || { echo "No episode with READY.txt or incoming images was found."; exit 1; }
          case "$P" in science-channel/daily-episodes/*) ;; *) echo "Invalid episode path: $P"; exit 1;; esac
          echo "path=$P" >> "$GITHUB_OUTPUT"
      - name: Validate, narrate, subtitle and render
        run: python science-channel/scripts/render_episode.py "${{ steps.episode.outputs.path }}"
      - name: Upload rendered outputs
        uses: actions/upload-artifact@v4
        with:
          name: science-channel-${{ github.run_id }}
          path: |
            ${{ steps.episode.outputs.path }}/output/
          if-no-files-found: error
          retention-days: 2
      - name: Send finished video to Telegram (non-blocking)
        continue-on-error: true
        uses: PonomarevDA/telegram-upload@v1
        with:
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          files: ${{ steps.episode.outputs.path }}/output/*.mp4
          message: "🎬 Episode rendered: ${{ steps.episode.outputs.path }}"
      - name: Remove uploaded ZIP after render and artifact save
        shell: bash
        run: |
          shopt -s nullglob
          zips=("${{ steps.episode.outputs.path }}"/images/incoming/*.zip "${{ steps.episode.outputs.path }}"/images/incoming/*.ZIP)
          if [ ${#zips[@]} -gt 0 ]; then
            git rm -- "${zips[@]}"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Remove processed image ZIP for rendered episode"
            git push origin HEAD:main
          else
            echo "No ZIP archive to remove."
          fi

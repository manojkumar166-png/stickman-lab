name: Free Science Visuals

on:
  workflow_dispatch:
  schedule:
    - cron: "30 7 * * *" # 1:00 PM India Standard Time (UTC+5:30)

permissions:
  contents: read

concurrency:
  group: free-science-visuals
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate free science video
        env:
          GEMINI_API_KEY: \${{ secrets.GEMINI_API_KEY }}
        run: python free_science_video.py

      - name: Upload video, story, narration, and image credits
        uses: actions/upload-artifact@v4
        with:
          name: free-science-video
          path: |
            output/free-science-*.mp4
            output/free-science-story-*.json
            output/free-science-narration-*.mp3
            output/free-science-image-credits-*.json
          retention-days: 7
          if-no-files-found: error

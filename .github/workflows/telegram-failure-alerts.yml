name: Telegram Failed Workflow Alerts

on:
  workflow_run:
    workflows:
      - "💡 AI Chat Videos"
      - "AI Story & Science Video Creator"
      - "AI Video Experiment"
      - "Free Science Visuals — Render Ready Episode"
      - "Science Channel — Daily Gemini Planner"
      - "Telegram Image Receiver"
      - "Telegram ZIP Import"
      - "Validate GitHub Actions workflows"
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  retry_failed_run:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: write
      contents: read
    steps:
      - name: Retry completed workflow's failed jobs
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Original workflow attempt $RUN_ATTEMPT has completed. Requesting retry $((RUN_ATTEMPT + 1))/3."
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/rerun-failed-jobs" >/dev/null
          echo "GitHub accepted the automatic failed-job retry."

  notify:
    needs: retry_failed_run
    if: >-
      always() &&
      github.event.workflow_run.conclusion == 'failure' &&
      (
        github.event.workflow_run.run_attempt >= 3 ||
        needs.retry_failed_run.result == 'failure'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: read
      contents: read
    steps:
      - name: Send final failure alert to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          REPOSITORY: ${{ github.repository }}
          RETRY_STATUS: ${{ needs.retry_failed_run.result }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$TELEGRAM_BOT_TOKEN" || -z "$TELEGRAM_CHAT_ID" ]]; then
            echo "::warning::Telegram failure notification skipped because bot secrets are not configured."
            exit 0
          fi
          if [[ "$RUN_ATTEMPT" -ge 3 ]]; then
            STATUS="Failed after $RUN_ATTEMPT attempts."
          else
            STATUS="Failed; GitHub could not start the automatic retry (retry job: $RETRY_STATUS)."
          fi
          MESSAGE="$(printf '❌ GitHub Actions workflow needs attention\n\nWorkflow: %s\nRun: #%s\nAttempt: %s\nBranch: %s\nRepository: %s\nStatus: %s\n\nLogs: %s' \
            "$WORKFLOW_NAME" "$RUN_NUMBER" "$RUN_ATTEMPT" "$BRANCH" "$REPOSITORY" "$STATUS" "$RUN_URL")"
          jq -n --arg chat_id "$TELEGRAM_CHAT_ID" --arg text "$MESSAGE" \
            '{chat_id: $chat_id, text: $text, disable_web_page_preview: true}' > telegram-payload.json
          curl --fail --silent --show-error --connect-timeout 15 --max-time 30 \
            --retry 4 --retry-all-errors --retry-delay 2 \
            --request POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --header "Content-Type: application/json" \
            --data-binary @telegram-payload.json

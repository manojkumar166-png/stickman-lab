name: Telegram Failed Workflow Alerts

on:
  workflow_run:
    workflows:
      - "💡 AI Chat Videos"
      - "AI Story & Science Video Creator"
      - "AI Video Experiment"
      - "Cinematic Stickman Film (original skill engine)"
      - "Daily Stickman Video"
      - "Free 3D Explainer Video Factory"
      - "ScriptForge + GrowKaz Stickman Explainer (free-first)"
      - "Free Science Visuals — Render Ready Episode"
      - "Science Channel — Daily Gemini Planner"
      - "Telegram Image Receiver"
      - "Telegram ZIP Import"
      - "Validate GitHub Actions workflows"
      - "Worker JavaScript syntax check"
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  notify:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Send failure alert to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${TELEGRAM_BOT_TOKEN:-}" || -z "${TELEGRAM_CHAT_ID:-}" ]]; then
            echo "::warning::Telegram failure notification skipped because bot secrets are not configured."
            exit 0
          fi
          MESSAGE="$(printf '❌ GitHub Actions workflow failed\n\nWorkflow: %s\nRun: #%s\nAttempt: %s\nBranch: %s\nRepository: %s\n\nLogs: %s' \
            "$WORKFLOW_NAME" "$RUN_NUMBER" "$RUN_ATTEMPT" "$BRANCH" "$REPOSITORY" "$RUN_URL")"
          jq -n --arg chat_id "$TELEGRAM_CHAT_ID" --arg text "$MESSAGE" \
            '{chat_id: $chat_id, text: $text, disable_web_page_preview: true}' > telegram-payload.json
          curl --fail --silent --show-error --connect-timeout 15 --max-time 30 \
            --retry 4 --retry-all-errors --retry-delay 2 \
            --request POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --header "Content-Type: application/json" \
            --data-binary @telegram-payload.json

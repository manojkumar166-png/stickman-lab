name: Telegram Failed Workflow Alerts

on:
  workflow_run:
    workflows:
      - "💡 AI Chat Videos"
      - "AI Story & Science Video Creator"
      - "AI Video Experiment"
      - "Free Science Visuals — Render Ready Episode"
      - "Science Channel — Daily Gemini Planner"
      - "Telegram Image Receiver"
      - "Telegram ZIP Import"
      - "Validate GitHub Actions workflows"
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  notify:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send failure alert to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$TELEGRAM_BOT_TOKEN" || -z "$TELEGRAM_CHAT_ID" ]]; then
            echo "::error::TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID repository secret is missing."
            exit 1
          fi
          MESSAGE="$(printf '❌ GitHub Actions workflow failed\n\nWorkflow: %s\nRun: #%s\nBranch: %s\nRepository: %s\nStatus: %s\n\nLogs: %s' \
            "$WORKFLOW_NAME" "$RUN_NUMBER" "$BRANCH" "$REPOSITORY" "$CONCLUSION" "$RUN_URL")"
          jq -n --arg chat_id "$TELEGRAM_CHAT_ID" --arg text "$MESSAGE" \
            '{chat_id: $chat_id, text: $text, disable_web_page_preview: true}' > telegram-payload.json
          curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 \
            --request POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --header "Content-Type: application/json" \
            --data-binary @telegram-payload.json

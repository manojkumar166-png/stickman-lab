name: Telegram ZIP Import
on:
  workflow_dispatch:
    inputs:
      episode_path:
        description: "Exact episode folder path selected in Telegram"
        required: true
        type: string
      telegram_file_id:
        description: "Telegram document file_id for the uploaded ZIP"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: telegram-zip-import-${{ inputs.episode_path }}
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install import dependency
        run: python -m pip install --upgrade requests
      - name: Download, validate and extract Telegram ZIP
        id: import
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_FILE_ID: ${{ inputs.telegram_file_id }}
          EPISODE_PATH: ${{ inputs.episode_path }}
        run: python science-channel/scripts/import_telegram_zip.py
      - name: Commit extracted scene images
        env:
          EPISODE_PATH: ${{ steps.import.outputs.episode_path }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$EPISODE_PATH/images/incoming" "$EPISODE_PATH/READY.txt"
          git commit -m "Import Telegram images for $(basename "$EPISODE_PATH")"
          git push origin HEAD:main

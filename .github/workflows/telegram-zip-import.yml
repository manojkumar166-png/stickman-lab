name: Telegram ZIP Import
on:
  workflow_dispatch:
    inputs:
      episode_path:
        description: "Exact episode folder path selected in Telegram"
        required: true
        type: string
      zip_path:
        description: "Repository path of the staged Telegram ZIP"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: telegram-zip-import-${{ inputs.episode_path }}
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate and extract staged Telegram ZIP
        id: import
        env:
          ZIP_PATH: ${{ inputs.zip_path }}
          EPISODE_PATH: ${{ inputs.episode_path }}
        run: python science-channel/scripts/import_telegram_zip.py
      - name: Commit extracted scene images and remove staged ZIP
        env:
          EPISODE_PATH: ${{ steps.import.outputs.episode_path }}
          ZIP_PATH: ${{ steps.import.outputs.zip_path }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$EPISODE_PATH/images/incoming" "$EPISODE_PATH/READY.txt"
          git rm "$ZIP_PATH"
          git commit -m "Import Telegram images for $(basename "$EPISODE_PATH")"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:refs/heads/main; then
              echo "Imported images published to main."
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying."
            if [ "$attempt" -lt 5 ]; then sleep $((attempt * 3)); fi
          done
          echo "Could not publish imported images after 5 attempts."
          exit 1

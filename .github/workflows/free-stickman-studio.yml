name: Free Stickman Studio

on:
  workflow_dispatch:
    inputs:
      title:
        description: "Video title"
        required: true
        default: "The Door to Tomorrow"
        type: string
      story:
        description: "Describe the story. The offline renderer turns it into simple scene beats."
        required: true
        default: "A lonely stickman notices a glowing door. He walks toward it, opens it, and discovers a bright new world. He waves to a friend and steps through with hope."
        type: string
      duration:
        description: "Video duration in seconds"
        required: true
        default: "20"
        type: choice
        options: ["10", "15", "20", "30", "45", "60"]
      resolution:
        description: "Output resolution"
        required: true
        default: "720p"
        type: choice
        options: ["720p", "1080p"]
      fps:
        description: "Frames per second"
        required: true
        default: "24"
        type: choice
        options: ["24", "30"]

permissions:
  contents: read

concurrency:
  group: free-stickman-studio-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    name: Render a free stickman MP4
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install free system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python renderer
        run: |
          python -m pip install --upgrade pip
          python -m pip install "Pillow>=10,<13"

      - name: Render video without external APIs
        env:
          STICKMAN_TITLE: ${{ inputs.title }}
          STICKMAN_STORY: ${{ inputs.story }}
          STICKMAN_SECONDS: ${{ inputs.duration }}
          OUTPUT_WIDTH: ${{ inputs.resolution == '1080p' && '1920' || '1280' }}
          OUTPUT_HEIGHT: ${{ inputs.resolution == '1080p' && '1080' || '720' }}
          OUTPUT_FPS: ${{ inputs.fps }}
        run: |
          set -euo pipefail
          python scripts/free_stickman_studio.py \
            --title "$STICKMAN_TITLE" \
            --story "$STICKMAN_STORY" \
            --seconds "$STICKMAN_SECONDS" \
            --fps "$OUTPUT_FPS" \
            --width "$OUTPUT_WIDTH" \
            --height "$OUTPUT_HEIGHT"

      - name: Verify MP4 with FFprobe
        run: |
          set -euo pipefail
          test -s output/free-stickman/stickman-short.mp4
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate \
            -show_entries format=duration,size -of json \
            output/free-stickman/stickman-short.mp4 | tee output/free-stickman/video-info.json

      - name: Upload MP4 and storyboard
        uses: actions/upload-artifact@v4
        with:
          name: free-stickman-${{ github.run_number }}
          path: output/free-stickman/
          if-no-files-found: error
          retention-days: 14

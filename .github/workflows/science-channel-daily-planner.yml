name: Science Channel — Daily Gemini Planner
on:
  schedule:
    - cron: "15 1 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: science-channel-daily-planner
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install planner dependencies
        run: python -m pip install --upgrade requests
      - name: Generate one unique episode package
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.SCIENCE_GEMINI_MODEL }}
        run: python science-channel/scripts/gemini_planner.py
      - name: Send image-prompts.md to StickmanLab Telegram bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          PROMPT_FILE="$(find science-channel/daily-episodes -type f -name image-prompts.md -printf '%T@ %p\\n' | sort -nr | head -n 1 | cut -d' ' -f2-)"
          if [ -z "$PROMPT_FILE" ] || [ ! -f "$PROMPT_FILE" ]; then
            echo "Could not find the newly generated image-prompts.md"
            exit 1
          fi
          EPISODE_DIR="$(dirname "$PROMPT_FILE")"
          TITLE="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8")).get("title", "New science episode"))' "$EPISODE_DIR/episode.json")"
          curl --fail --silent --show-error \
            -F "chat_id=${TELEGRAM_CHAT_ID}" \
            -F "document=@${PROMPT_FILE};filename=image-prompts.md" \
            -F "caption=🖼️ Image prompts ready: ${TITLE}" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument"
      - name: Commit new science-channel packages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add science-channel/
          if ! git diff --cached --quiet; then
            git commit -m "Add daily science channel episode plans"
            git push origin HEAD:main
          fi

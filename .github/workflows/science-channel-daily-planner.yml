name: Science Channel — Daily Gemini Planner
on:
  schedule:
    - cron: "15 1 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: science-channel-daily-planner
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install planner dependencies
        run: python -m pip install --upgrade requests
      - name: Generate one unique episode package
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.SCIENCE_GEMINI_MODEL }}
        run: python science-channel/scripts/gemini_planner.py
      - name: Commit new science-channel packages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add science-channel/
          if ! git diff --cached --quiet; then
            git commit -m "Add daily science channel episode plans"
            git push origin HEAD:main
          fi

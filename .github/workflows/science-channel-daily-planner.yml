name: Science Channel — Daily Gemini Planner
on:
  schedule:
    - cron: "15 1 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: stickman-lab-main-writer
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SCIENCE_BRANCH: main
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install planner dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --retries 5 --timeout 60 requests
      - name: Mark start time
        run: touch /tmp/planner-start
      - name: Generate one unique episode package
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.SCIENCE_GEMINI_MODEL }}
        run: python science-channel/scripts/gemini_planner.py
      - name: Identify generated episode
        id: generated
        shell: bash
        run: |
          mapfile -t FILES < <(find science-channel/daily-episodes -type f -name episode.json -newer /tmp/planner-start | sort)
          if [ "${#FILES[@]}" -ne 1 ]; then
            echo "Expected exactly one newly generated episode.json; found ${#FILES[@]}."
            printf '%s\\n' "${FILES[@]}"
            exit 1
          fi
          EPISODE_DIR="$(dirname "${FILES[0]}")"
          echo "path=$EPISODE_DIR" >> "$GITHUB_OUTPUT"
      - name: Commit episode to main (retry safely)
        id: source_commit
        env:
          EPISODE_PATH: ${{ steps.generated.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The planner reserves the accepted topic in this history file before
          # building the episode. Commit it with the package so rebase starts
          # from a clean worktree and the no-repeat history reaches main too.
          git add "$EPISODE_PATH" science-channel/history/generated-topics.json
          git commit -m "Add Gemini-planned episode"
          for attempt in 1 2 3; do
            if ! git fetch origin main; then
              echo "Fetch attempt $attempt failed; retrying."
              if [ "$attempt" -lt 3 ]; then sleep $((attempt * 3)); fi
              continue
            fi
            # Keep any incidental generated/untracked files out of the rebase.
            # The episode and topic history are already committed above.
            if ! git diff --quiet || [ -n "$(git ls-files --others --exclude-standard)" ]; then
              echo "Unexpected worktree changes before rebase:"
              git status --short
              exit 1
            fi
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Rebase conflict; refusing to overwrite concurrent main-branch changes."
              exit 1
            fi
            if git push origin HEAD:refs/heads/main; then
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying."
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 3)); fi
          done
          echo "Could not publish episode to main after 3 attempts."
          exit 1
      - name: Verify episode exists on main
        env:
          EPISODE_PATH: ${{ steps.generated.outputs.path }}
        run: |
          git fetch origin main
          git cat-file -e "origin/main:$EPISODE_PATH/episode.json"
          echo "Verified $EPISODE_PATH on main."
      - name: Send episode prompts to Telegram only after main commit
        if: success()
        id: telegram
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EPISODE_PATH: ${{ steps.generated.outputs.path }}
        run: |
          set -euo pipefail
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "Telegram secrets are not configured; skipping prompt delivery."
            exit 0
          fi
          PROMPT_FILE="$EPISODE_PATH/image-prompts.md"
          test -f "$PROMPT_FILE"
          TITLE="$(python -c 'import json,os; print(json.load(open(os.path.join(os.environ["EPISODE_PATH"],"episode.json"), encoding="utf-8")).get("title", "New science episode"))')"
          curl --fail --silent --show-error \
            --connect-timeout 20 --max-time 120 \
            --retry 5 --retry-all-errors --retry-delay 3 \
            -F "chat_id=$TELEGRAM_CHAT_ID" \
            -F "document=@$PROMPT_FILE;filename=image-prompts.md" \
            -F "caption=🖼️ Episode package committed to main: $TITLE | Upload 48 numbered images to $EPISODE_PATH/images/incoming/" \
            "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendDocument"
      - name: Report prompt-delivery status
        if: steps.telegram.outcome == 'failure'
        run: echo "::warning::The episode is safely committed to main, but Telegram prompt delivery failed. The prompt file remains available in the episode folder."

      - name: Preserve generated episode package if publication fails
        if: failure() && steps.generated.outputs.path != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: science-planner-recovery-${{ github.run_id }}
          path: |
            ${{ steps.generated.outputs.path }}/
            science-channel/history/generated-topics.json
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6
      - name: Alert Telegram when workflow fails
        if: failure()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WORKFLOW_NAME: ${{ github.workflow }}
          JOB_NAME: ${{ github.job }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${TELEGRAM_BOT_TOKEN:-}" || -z "${TELEGRAM_CHAT_ID:-}" ]]; then
            echo "Telegram alert skipped: TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID is not configured."
            exit 0
          fi
          MESSAGE="$(printf '%s\n' '🚨 GitHub Actions workflow failed' "Workflow: $WORKFLOW_NAME" "Job: $JOB_NAME" "Branch: $BRANCH_NAME" "Run: #$RUN_NUMBER" "$RUN_URL")"
          curl --fail --silent --show-error \
            --connect-timeout 15 --max-time 30 \
            --retry 3 --retry-all-errors --retry-delay 2 \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}"

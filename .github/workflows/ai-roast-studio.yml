name: 🤖 AI Chat Videos

on:
  workflow_dispatch:
    inputs:
      telegram_file_id:
        description: "Telegram file_id supplied by the private bot webhook"
        required: true
        type: string
      original_filename:
        description: "Original uploaded filename"
        required: false
        default: "chat-recording.mp4"
        type: string

permissions:
  contents: read

concurrency:
  group: ai-roast-studio-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  edit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install FFmpeg, Tesseract and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg tesseract-ocr fonts-dejavu-core

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-roast-studio/requirements.txt

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r ai-roast-studio/requirements.txt

      - name: Run automatic editor and send result to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_FILE_ID: ${{ inputs.telegram_file_id }}
          ORIGINAL_FILENAME: ${{ inputs.original_filename }}
        run: python -u ai-roast-studio/telegram_roast.py

      - name: Notify Telegram if the job fails
        if: failure()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl --fail --silent --show-error \
            --connect-timeout 15 --max-time 30 \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=AI Roast Studio failed. Logs: ${RUN_URL}"

name: Daily Stickman Video

on:
  schedule:
    # 07:00 Asia/Kolkata (IST) = 01:30 UTC
    - cron: "30 1 * * *"
  workflow_dispatch:
    inputs:
      force_topic:
        description: "Optional topic title (duplicates are rejected)"
        required: false
        type: string
      style:
        description: "Visual style"
        required: false
        default: "2D cinematic"
        type: string

permissions:
  contents: write

concurrency:
  group: daily-stickman-video
  cancel-in-progress: false

jobs:
  generate:
    name: Generate a fresh stickman short
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate fresh film
        env:
          FORCE_TOPIC: ${{ github.event.inputs.force_topic }}
          FILM_STYLE: ${{ github.event.inputs.style }}
        run: |
          args=()
          if [ -n "$FORCE_TOPIC" ]; then args+=(--force-topic "$FORCE_TOPIC"); fi
          if [ -n "$FILM_STYLE" ]; then args+=(--style "$FILM_STYLE"); fi
          python scripts/generate_daily_stickman.py "${args[@]}"

      - name: Build HTML player
        run: python scripts/build_stickman_player.py

      - name: Upload film artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-stickman-video-${{ github.run_number }}
          path: stickman-films/
          retention-days: 30

      - name: Commit generated film and history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stickman-films/
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Generate daily stickman video"
            git push
          fi

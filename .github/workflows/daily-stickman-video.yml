name: Daily Stickman Video

on:
  schedule:
    # 07:00 Asia/Kolkata (IST) = 01:30 UTC
    - cron: "30 1 * * *"
  workflow_dispatch:
    inputs:
      force_topic:
        description: "Optional topic title (duplicates are rejected)"
        required: false
        type: string
      style:
        description: "Visual style"
        required: false
        default: "2D cinematic"
        type: string

permissions:
  contents: write

concurrency:
  group: stickman-lab-main-writer
  cancel-in-progress: false

jobs:
  generate:
    name: Generate and render a fresh stickman short
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install rendering dependencies
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if sudo apt-get update; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 10))
          done
          for attempt in 1 2 3; do
            if sudo apt-get install -y ffmpeg; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 10))
          done
          python -m pip install --retries 5 --timeout 60 --upgrade pip
          python -m pip install --retries 5 --timeout 60 Pillow

      - name: Generate fresh film and storyboard
        env:
          FORCE_TOPIC: ${{ github.event.inputs.force_topic }}
          FILM_STYLE: ${{ github.event.inputs.style }}
        run: |
          args=()
          if [ -n "$FORCE_TOPIC" ]; then args+=(--force-topic "$FORCE_TOPIC"); fi
          if [ -n "$FILM_STYLE" ]; then args+=(--style "$FILM_STYLE"); fi
          python scripts/generate_daily_stickman.py "${args[@]}"

      - name: Render actual 30-second MP4
        run: python scripts/render_stickman_video.py

      - name: Validate rendered MP4
        shell: bash
        run: |
          set -euo pipefail
          test -s stickman-films/latest/video.mp4
          duration="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 stickman-films/latest/video.mp4)"
          python - "$duration" <<'PY'
          import sys
          duration = float(sys.argv[1])
          if not 1 <= duration <= 60:
              raise SystemExit(f"Rendered video duration is outside the expected range: {duration:.2f}s")
          print(f"Validated MP4 duration: {duration:.2f}s")
          PY

      - name: Build HTML player
        run: python scripts/build_stickman_player.py

      - name: Upload rendered video and project files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: daily-stickman-video-${{ github.run_number }}
          path: |
            stickman-films/latest/video.mp4
            stickman-films/latest/film.json
            stickman-films/latest/title.txt
            stickman-films/latest/index.html
            stickman-films/history.json
          retention-days: 30

      - name: Commit generated film, MP4, player and history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stickman-films/
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Generate daily stickman MP4"
          for attempt in 1 2 3 4 5; do
            if ! git fetch origin "$GITHUB_REF_NAME"; then
              echo "Fetch attempt $attempt failed."
              [ "$attempt" -lt 5 ] && sleep $((attempt * 3))
              continue
            fi
            if ! git rebase "origin/$GITHUB_REF_NAME"; then
              git rebase --abort || true
              echo "Rebase conflict; refusing to overwrite concurrent branch changes."
              exit 1
            fi
            if git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"; then
              echo "Published generated stickman film."
              exit 0
            fi
            echo "Push attempt $attempt failed."
            [ "$attempt" -lt 5 ] && sleep $((attempt * 3))
          done
          echo "::error::Could not publish generated film after five attempts."
          exit 1

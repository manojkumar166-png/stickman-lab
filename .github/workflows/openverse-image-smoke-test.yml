name: Openverse image-source smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

# Prevent multiple copies of this API smoke test from running together.
concurrency:
  group: openverse-image-smoke-test
  cancel-in-progress: false

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Run before installing FFmpeg, Chromium, or the video dependencies.
      - name: Test free image search with bounded concurrency
        run: python scripts/test_openverse_search.py

      - name: Upload search results for manual relevance review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openverse-smoke-test-results
          path: output/openverse-smoke-test.json
          if-no-files-found: ignore
          retention-days: 3

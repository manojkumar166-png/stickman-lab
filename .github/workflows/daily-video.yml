name: Daily Stickman Science Video — Storybook 2D

on:
  workflow_dispatch:
  schedule:
    - cron: "30 4 * * *" # 10:00 AM IST

permissions:
  contents: write

concurrency:
  group: daily-stickman-video
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate daily storybook 2D science video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONUNBUFFERED: "1"
          TOPIC_HISTORY_FILE: storybook_topic_history.json
        run: python -u storybook_science_video.py

      - name: Get Video Topic
        id: get_topic
        run: |
          TOPIC=$(python -c "import json,glob; print(json.load(open(glob.glob('output/storybook-science-story-*.json')[0]))['topic'])")
          echo "topic_name=$TOPIC" >> $GITHUB_OUTPUT

      - name: Send Video to Telegram
        if: ${{ secrets.TELEGRAM_BOT_TOKEN != '' && secrets.TELEGRAM_CHAT_ID != '' }}
        uses: PonomarevDA/telegram-upload@v1
        with:
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          files: output/storybook-science-*.mp4
          message: "🌿 New Storybook Science Video: ${{ steps.get_topic.outputs.topic_name }}"

      - name: Upload video, story, narration, and image credits
        uses: actions/upload-artifact@v4
        with:
          name: daily-stickman-storybook-2d
          path: |
            output/storybook-science-*.mp4
            output/storybook-science-story-*.json
            output/storybook-science-narration-*.mp3
            output/storybook-science-image-credits-*.json
          retention-days: 7
          if-no-files-found: error

      - name: Commit this workflow's topic history only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add storybook_topic_history.json
          git commit -m "Update daily storybook science topic history [skip ci]" || exit 0
          git push origin HEAD:${GITHUB_REF_NAME}

name: Daily Stickman Science Video

on:
  workflow_dispatch:
  schedule:
    - cron: "30 4 * * *" # 10:00 AM IST

permissions:
  contents: write

concurrency:
  group: daily-stickman-video
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Generate daily video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py

      - name: Get Video Topic
        id: get_topic
        run: |
          TOPIC=$(python -c "import json,glob; print(json.load(open(glob.glob('output/story-*.json')[0]))['topic'])")
          echo "topic_name=$TOPIC" >> $GITHUB_OUTPUT

      - name: Send Video to Telegram
        uses: PonomarevDA/telegram-upload@v1
        with:
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          files: output/stickman-science-*.mp4
          message: "🎬 New Stickman Science Video: ${{ steps.get_topic.outputs.topic_name }}"

      - name: Upload video, script and narration
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: stickman-science-video
          path: |
            output/stickman-science-*.mp4
            output/story-*.json
            output/narration-*.mp3
          retention-days: 7
          if-no-files-found: error

      - name: Commit topic history
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add topic_history.json
          git commit -m "Update stickman topic history [skip ci]" || exit 0
          git pull --rebase origin main
          git push
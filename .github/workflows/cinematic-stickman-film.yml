name: Cinematic Stickman Film (in-repo renderer)

on:
  workflow_dispatch:
    inputs:
      approve_preview:
        description: "Set to yes only after reviewing the contact sheet artifact"
        required: true
        type: choice
        options:
          - "no"
          - "yes"
        default: "no"

permissions:
  contents: write

concurrency:
  group: cinematic-stickman-film
  cancel-in-progress: false

jobs:
  render:
    name: Render cinematic stickman film
    runs-on: ubuntu-latest
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node for Playwright
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Playwright and Chromium
        run: |
          npm install --no-package-lock
          npx playwright install --with-deps chromium

      - name: Render review stills and contact sheet FIRST
        run: node scripts/build_cinematic_film.mjs --preview-only

      - name: Upload stills and contact sheet for review
        uses: actions/upload-artifact@v4
        with:
          name: door-to-tomorrow-stills-${{ github.run_number }}
          path: |
            stickman-films/latest/contact-sheet.*
            stickman-films/latest/preview-*.jpg
          if-no-files-found: error
          retention-days: 14

      - name: Build final 30-second MP4 only after preview approval
        if: ${{ inputs.approve_preview == 'yes' }}
        run: node scripts/build_cinematic_film.mjs

      - name: Audit delivered MP4
        if: ${{ inputs.approve_preview == 'yes' }}
        shell: bash
        run: |
          set -euo pipefail
          test -s stickman-films/latest/video.mp4
          ffprobe -v error -show_entries format=duration,size:stream=codec_type,codec_name,width,height,r_frame_rate -of json stickman-films/latest/video.mp4 > /tmp/video-audit.json
          python - <<'PY'
          import json
          d = json.load(open('/tmp/video-audit.json'))
          v = next(s for s in d['streams'] if s.get('codec_type') == 'video')
          duration = float(d['format']['duration'])
          assert v['codec_name'] == 'h264', v
          assert (v['width'], v['height']) == (1920, 1080), v
          assert v['r_frame_rate'] == '30/1', v
          assert 29.9 <= duration <= 30.1, duration
          print(f"PASS: H.264, 1920x1080, 30fps, {duration:.3f}s")
          print(f"File size: {int(d['format']['size']):,} bytes")
          PY

      - name: Upload final MP4 and audit
        if: ${{ inputs.approve_preview == 'yes' }}
        uses: actions/upload-artifact@v4
        with:
          name: the-door-that-opens-to-tomorrow-mp4-${{ github.run_number }}
          path: |
            stickman-films/latest/video.mp4
            /tmp/video-audit.json
          if-no-files-found: error
          retention-days: 30

      - name: Commit approved MP4 output to selected branch
        if: ${{ inputs.approve_preview == 'yes' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stickman-films/latest/video.mp4
          if git diff --cached --quiet; then
            echo "No generated MP4 changes to commit."
          else
            git commit -m "Render The Door That Opens to Tomorrow MP4"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

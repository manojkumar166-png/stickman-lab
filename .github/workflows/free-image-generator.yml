name: Free Image Generator

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: Image prompt
        required: true
        type: string
      width:
        description: Image width (256–2048)
        required: false
        default: "1024"
        type: string
      height:
        description: Image height (256–2048)
        required: false
        default: "576"
        type: string
  schedule:
    - cron: "0 6 * * *" # Daily at 11:30 AM IST

permissions:
  contents: read

concurrency:
  group: free-image-generator
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install image dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --retries 5 --timeout 60 requests Pillow
      - name: Generate with free providers and automatic fallback
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          OVH_AI_ENDPOINTS_ACCESS_TOKEN: ${{ secrets.OVH_AI_ENDPOINTS_ACCESS_TOKEN }}
          IMAGE_PROMPT: ${{ inputs.prompt }}
          IMAGE_WIDTH: ${{ inputs.width }}
          IMAGE_HEIGHT: ${{ inputs.height }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            PROMPT="A polished, cinematic science illustration showing the beauty of the natural universe, rich detail, clear visual storytelling, no text, no labels, no watermark"
            WIDTH=1024
            HEIGHT=576
          else
            PROMPT="$IMAGE_PROMPT"
            WIDTH="$IMAGE_WIDTH"
            HEIGHT="$IMAGE_HEIGHT"
          fi
          python scripts/free_image_generator.py --prompt "$PROMPT" --width "$WIDTH" --height "$HEIGHT"
      - name: Upload generated image and provider log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: free-generated-image-${{ github.run_number }}
          path: |
            free-image-generator/output/
            free-image-generator/provider-log.jsonl
          if-no-files-found: warn
          retention-days: 14

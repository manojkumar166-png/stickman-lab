name: Worker JavaScript syntax check

on:
  push:
    paths:
      - "cloudflare-worker.js"
      - ".github/workflows/worker-syntax-check.yml"
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Worker syntax
        run: node --check cloudflare-worker.js

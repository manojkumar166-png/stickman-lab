name: Free Animated 3D Explainer (Three.js + Remotion)

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "Generate ideas first, then render the idea you choose"
        required: true
        default: "ideas"
        type: choice
        options: ["ideas", "render"]
      selected_topic:
        description: "Paste your chosen idea title when stage is render"
        required: false
        default: ""
        type: string
      custom_niche:
        description: "Optional custom niche (overrides the niche choice)"
        required: false
        default: ""
        type: string
      sub_niche:
        description: "Optional focused sub-niche"
        required: false
        default: ""
        type: string
      visual_style:
        description: "GrowKaz visual style"
        required: true
        default: "emerald"
        type: choice
        options: ["emerald", "ember", "arctic", "sakura", "retro"]
      aspect_ratio:
        description: "Video orientation"
        required: true
        default: "16:9"
        type: choice
        options: ["16:9", "9:16"]
      resolution:
        description: "GrowKaz output resolution"
        required: true
        default: "1080p"
        type: choice
        options: ["720p", "1080p", "1440p", "2160p"]
      target_minutes:
        description: "Approximate video length"
        required: true
        default: "6"
        type: choice
        options: ["3", "4", "5", "6", "7", "8"]
      content_niche:
        description: "Video niche"
        required: true
        default: "science"
        type: choice
        options: ["science", "finance", "psychology", "history", "technology", "self-improvement", "what-if", "general education"]

permissions:
  contents: read

concurrency:
  group: free-animated-3d-explainer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    name: Generate animated 3D explainer
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Generate 10 ScriptForge ideas
        if: inputs.stage == 'ideas'
        env:
          CONTENT_NICHE: ${{ inputs.content_niche }}
          CUSTOM_NICHE: ${{ inputs.custom_niche }}
          SUB_NICHE: ${{ inputs.sub_niche }}
          SELECTED_TOPIC: ${{ inputs.selected_topic }}
        run: |
          set -euo pipefail
          mkdir -p output
          python - <<'PY'
          import json, os
          niche = os.environ.get("CUSTOM_NICHE", "").strip() or os.environ.get("CONTENT_NICHE", "science")
          sub_niche = os.environ.get("SUB_NICHE", "").strip()
          banks = {
            "science": [
              ("Why the Moon Changes Shape Every Night","The sunlight-and-orbit explanation behind the phases we see."),
              ("How Plants Turn Sunlight Into Food","Follow photosynthesis from light capture to the sugars plants use."),
              ("Why Lightning Happens Before Thunder","Compare light and sound to explain a familiar storm."),
              ("What If Earth Stopped Spinning?","Separate the physics of an instant stop from gradual slowing."),
              ("How Deep Is the Ocean, Really?","Journey through ocean zones and the life adapted to each."),
              ("Why Does Ice Float on Water?","Discover the unusual structure of water and why it matters."),
              ("How Do Vaccines Train the Immune System?","Explain immune memory in clear, careful, non-medical-advice terms."),
              ("Can a Black Hole Trap Light?","Use gravity and spacetime to explain the event horizon."),
              ("Why Do We See Colors That Aren’t in Light?","Explore how eyes and brains interpret different wavelengths."),
              ("How Do Birds Navigate Across Continents?","Look at stars, landmarks, and magnetic cues used in migration.")],
            "psychology": [
              ("Why Your Brain Replays Awkward Moments","Explore negativity bias and why embarrassing memories can stick."),
              ("How Manipulators Use Guilt in Conversations","Spot pressure tactics and practice boundary-based responses."),
              ("Why People Follow the Crowd","See how social proof shapes decisions under uncertainty."),
              ("The Psychology Behind First Impressions","Separate quick judgments from reliable knowledge."),
              ("Why Silence Feels So Uncomfortable","Understand pauses, expectations, and social interaction."),
              ("How Your Memory Quietly Rewrites the Past","Learn why remembering is reconstruction, not replay."),
              ("Why We Trust Confident People Too Quickly","Explore confidence bias and how to assess claims."),
              ("Subtle Signs of Emotional Manipulation","Recognize blame shifting and coercive pressure in context."),
              ("Why Rejection Feels So Much Bigger","Understand threat sensitivity and regain perspective."),
              ("How Small Rewards Turn Actions Into Habits","Follow the cue-routine-reward loop and how habits change.")],
            "self-improvement": [
              ("Why Motivation Disappears When You Need It","Find the friction behind fading intentions and make action easier."),
              ("The 2-Minute Rule That Makes Starting Easier","Use a tiny starting ritual to lower resistance."),
              ("Why Your Brain Loves Easy Distractions","See how cues compete with long-term goals."),
              ("The Quiet Habit That Builds Confidence","Learn why confidence often follows repeated progress."),
              ("How to Stop Restarting Every Monday","Build a system that can recover after an imperfect day."),
              ("Why Doing Less Can Make You More Productive","Use priorities to protect attention from task switching."),
              ("The Hidden Cost of Constant Phone Checking","See how interruptions fragment focus."),
              ("Can 10 Minutes a Day Build a Skill?","Understand deliberate practice, feedback, and consistency."),
              ("Why Willpower Is a Weak Daily Strategy","Use routines and environment design instead."),
              ("How to Build Discipline Without Hating It","Make consistency sustainable with small commitments.")],
            "history": [
              ("How the Silk Road Changed the World","Trace how trade moved ideas, technologies, and goods."),
              ("Why the Roman Empire Split in Two","Explore the pressures behind a complex historical change."),
              ("The Ancient City Buried Beneath the Sand","Investigate what archaeology can and cannot reveal."),
              ("How One Invention Spread Books to the Masses","Follow printing and the changing speed of information."),
              ("What Really Happened to Alexandria’s Library?","Separate popular legend from historical evidence."),
              ("Why Medieval Castles Were Hard to Capture","See how geography and engineering shaped sieges."),
              ("How Ancient People Measured the Stars","Explore astronomy before modern telescopes."),
              ("The Trade Network Linking Three Continents","Follow merchants and routes across distant societies."),
              ("Why Did the Bronze Age Collapse?","Compare several interacting explanations."),
              ("What Daily Life Looked Like in Ancient Cities","Reconstruct routines from homes, tools, and records.")],
            "technology": [
              ("How the Internet Finds the Right Computer","Follow packets, routers, and addresses through a network."),
              ("How AI Models Learn Patterns","Explain training, prediction, and why models make mistakes."),
              ("What Happens When You Tap a Smartphone?","Trace touch sensing, software, and display response."),
              ("How a Battery Stores Electricity","Explore chemical reactions and charged particles."),
              ("Why Computers Use Ones and Zeros","See how binary represents numbers, text, images, and sound."),
              ("How GPS Knows Where You Are","Use satellite timing and geometry to explain positioning."),
              ("Can Robots Learn to Walk by Falling?","Explore feedback, balance, and iterative control."),
              ("How Wi-Fi Sends Data Through the Air","Understand radio waves and the role of a router."),
              ("How a Self-Driving Car Sees the Road","Explore sensors, mapping, and limits of automated perception."),
              ("How Code Turns Into 3D Animation","Follow geometry, frames, lighting, and rendering.")],
            "finance": [
              ("Why Compound Growth Surprises Everyone","See how returns build on earlier returns over time."),
              ("What Actually Makes Prices Go Up?","Explore supply, demand, costs, and expectations."),
              ("Why an Emergency Fund Is So Powerful","Understand how reserves can reduce last-minute borrowing."),
              ("How Does a Credit Score Work?","Break down payment history and common scoring factors."),
              ("Saving vs Investing: What’s the Difference?","Compare goals, risk, time horizons, and liquidity."),
              ("How Small Fees Eat Into Long-Term Returns","See how recurring costs compound."),
              ("How Banks Make Money From Deposits","Explain lending, interest margins, and regulation."),
              ("Why Diversification Is More Than Owning Many Stocks","Explore how different risks behave across a portfolio."),
              ("What Inflation Does to Your Savings","Show how purchasing power changes as prices rise."),
              ("Why a Budget Is a Plan for Choices","Turn income and expenses into practical decisions.")],
            "general education": [
              ("Why We Forget Things We Just Learned","Explore attention, encoding, retrieval, and spaced practice."),
              ("How Maps Flatten a Round Planet","Understand projections and unavoidable distortions."),
              ("Why Time Feels Faster as We Get Older","Explore memory, novelty, and perception."),
              ("How Languages Change Over Time","Follow sound shifts, borrowing, and everyday usage."),
              ("Why Simple Rules Create Complex Patterns","Use nature to introduce emergence."),
              ("How We Know What Happened Millions of Years Ago","Explore fossils, dating methods, and converging evidence."),
              ("Why Two People See the Same Event Differently","Look at attention, prior knowledge, and interpretation."),
              ("How Sound Travels Through a Room","Follow vibrations and how surfaces shape sound."),
              ("What Makes a Good Scientific Experiment?","Explain controls, variables, and repeatability."),
              ("How Bridges Stay Standing Under Heavy Loads","Explore forces, materials, and structural design.")]
          }
          ideas = banks.get(niche.lower(), banks["general education"])
          data = {"niche": niche, "sub_niche": sub_niche, "ideas": [{"number":i+1,"title":t,"hook":(h + (" Focus: " + sub_niche + "." if sub_niche else ""))} for i,(t,h) in enumerate(ideas)]}
          with open("output/scriptforge-ideas.json","w",encoding="utf-8") as f: json.dump(data,f,ensure_ascii=False,indent=2)
          with open("output/scriptforge-ideas.md","w",encoding="utf-8") as f:
              f.write("# 10 video ideas — " + niche + "\n\n")
              for x in data["ideas"]: f.write("## " + str(x["number"]) + ". " + x["title"] + "\n\n" + x["hook"] + "\n\n")
          print("Exactly 10 ideas ready. Choose one title and rerun with stage=render.")
          PY

      - name: Upload ScriptForge ideas
        if: inputs.stage == 'ideas'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scriptforge-ideas-${{ github.run_number }}
          path: output/scriptforge-ideas.*
          retention-days: 7

      - name: Set up Python
        if: inputs.stage == 'render'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        if: inputs.stage == 'render'
        uses: actions/setup-node@1a4442cacd436585916779262731d5b162bc6ec7 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: remotion/package.json

      - name: Install system and free voice tools
        if: inputs.stage == 'render'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install requests Pillow edge-tts gTTS

      - name: Generate story, voiceover and original background sound
        if: inputs.stage == 'render'
        env:
          TARGET_MINUTES: ${{ inputs.target_minutes }}
          CONTENT_NICHE: ${{ inputs.content_niche }}
          CUSTOM_NICHE: ${{ inputs.custom_niche }}
          SUB_NICHE: ${{ inputs.sub_niche }}
          SELECTED_TOPIC: ${{ inputs.selected_topic }}
          VISUAL_STYLE: ${{ inputs.visual_style }}
          ASPECT_RATIO: ${{ inputs.aspect_ratio }}
          RESOLUTION: ${{ inputs.resolution }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, math, os, shutil, subprocess, wave
          from array import array
          from pathlib import Path
          from datetime import datetime, timezone

          # Inject the selected ScriptForge topic into the existing story planner.
          generator = root = Path.cwd()
          generator_path = root / "scripts" / "generate_story.py"
          source = generator_path.read_text(encoding="utf-8")
          source = source.replace(
              '    niche = niche[:80]\n',
              '    niche = niche[:80]\n    selected_topic = str(config.get("selected_topic", "")).strip()[:180]\n'
          )
          source = source.replace(
              'Choose ONE fresh, specific, curiosity-driven question in this category or niche: {category}.\n',
              'Choose ONE fresh, specific, curiosity-driven question in this category or niche: {category}.\n{("Use this exact user-selected topic as the title and answer it directly: " + selected_topic) if selected_topic else "Choose a fresh topic yourself."}\n'
          )
          source = source.replace(
              '        candidate_topic = str(candidate_story.get("topic", "")).strip()\n',
              '        if selected_topic:\n            candidate_story["topic"] = selected_topic\n        candidate_topic = str(candidate_story.get("topic", "")).strip()\n'
          )
          source = source.replace(
              '        story = _local_story_fallback(niche, desired_scene_count, history)\n        used_model = "offline:template"\n',
              '        story = _local_story_fallback(niche, desired_scene_count, history)\n        if selected_topic:\n            story["topic"] = selected_topic\n            story["description"] = f"A clear animated explainer about {selected_topic}."\n        used_model = "offline:template"\n'
          )
          generator_path.write_text(source, encoding="utf-8")

          from scripts.generate_story import generate_story
          from scripts.make_voice import make_voice

          root = Path.cwd()
          output = root / "output"
          public = root / "remotion" / "public"
          output.mkdir(exist_ok=True)
          public.mkdir(parents=True, exist_ok=True)

          config = json.loads((root / "config.json").read_text(encoding="utf-8"))
          minutes = int(os.environ.get("TARGET_MINUTES", "6"))
          config["target_minutes"] = minutes
          config["content_niche"] = os.environ.get("CUSTOM_NICHE", "").strip() or os.environ.get("CONTENT_NICHE", "science")
          config["sub_niche"] = os.environ.get("SUB_NICHE", "").strip()
          selected_topic = os.environ.get("SELECTED_TOPIC", "").strip()
          if not selected_topic:
              raise RuntimeError("Paste the chosen idea into selected_topic when stage=render.")
          config["selected_topic"] = selected_topic
          config["scene_count"] = max(15, minutes * 5)
          config["topic_history_file"] = "free_animated_3d_topic_history.json"

          # Uses Gemini when GEMINI_API_KEY is configured; otherwise starts with
          # anonymous free providers and retains the deterministic local fallback.
          story = generate_story(root, config)
          scenes = story.get("scenes", [])
          if not isinstance(scenes, list) or not scenes:
              raise RuntimeError("The free story planner returned no scenes.")

          stamp = datetime.now(timezone.utc).strftime("%Y%m%d-%H%M%S")
          story_path = output / f"animated-story-{stamp}.json"
          story_path.write_text(json.dumps(story, ensure_ascii=False, indent=2), encoding="utf-8")

          narration = "\n\n".join(
              str(scene.get("narration", "")).strip()
              for scene in scenes if scene.get("narration")
          )
          if not narration.strip():
              raise RuntimeError("Generated story has no narration.")

          voice_path = output / f"narration-{stamp}.mp3"
          make_voice(narration, voice_path, config)
          shutil.copy2(voice_path, public / "narration.mp3")

          probe = subprocess.run(
              ["ffprobe", "-v", "error", "-show_entries", "format=duration",
               "-of", "default=noprint_wrappers=1:nokey=1", str(voice_path)],
              check=True, capture_output=True, text=True
          )
          duration = max(1.0, float(probe.stdout.strip()))
          fps = 30
          total_frames = max(len(scenes), round(duration * fps))
          weights = [max(1, len(str(s.get("narration", "")).split())) for s in scenes]
          weight_sum = sum(weights)
          durations = [max(1, round(total_frames * w / weight_sum)) for w in weights]
          durations[-1] += total_frames - sum(durations)

          # Create an original, royalty-free ambient bed and small scene-change chimes.
          sample_rate = 22050
          total_samples = int(duration * sample_rate)
          samples = array("h")
          boundaries = [sum(durations[:j]) / fps for j in range(1, len(durations))]
          boundary_index = 0
          for i in range(total_samples):
              t = i / sample_rate
              while boundary_index < len(boundaries) and t >= boundaries[boundary_index] + 0.42:
                  boundary_index += 1
              fade_in = min(1.0, t / 2.5)
              fade_out = min(1.0, (duration - t) / 3.0)
              bed = (
                  0.42 * math.sin(2 * math.pi * 110.0 * t) +
                  0.22 * math.sin(2 * math.pi * 164.81 * t) +
                  0.12 * math.sin(2 * math.pi * 220.0 * t)
              )
              pulse = 0.5 + 0.5 * math.sin(2 * math.pi * 0.08 * t)
              chime = 0.0
              if boundary_index < len(boundaries):
                  delta = t - boundaries[boundary_index]
                  if 0 <= delta < 0.42:
                      chime = 0.18 * math.sin(2 * math.pi * 660 * delta) * math.exp(-8 * delta)
              value = (bed * (0.045 + 0.018 * pulse) + chime * 0.10) * fade_in * fade_out
              samples.append(max(-32767, min(32767, int(value * 32767))))
          with wave.open(str(public / "ambient.wav"), "wb") as wav:
              wav.setnchannels(1)
              wav.setsampwidth(2)
              wav.setframerate(sample_rate)
              wav.writeframes(samples.tobytes())

          props = {
              "topic": story.get("topic", "Animated explainer"),
              "scenes": scenes,
              "sceneDurations": durations,
              "audioFile": "narration.mp3",
              "musicFile": "ambient.wav"
          }
          (public / "props.json").write_text(json.dumps(props, ensure_ascii=False), encoding="utf-8")
          print(f"TOPIC={props['topic']}")
          print(f"SCENES={len(scenes)}")
          print(f"VOICE_SECONDS={duration:.1f}")
          print(f"TOTAL_FRAMES={sum(durations)}")
          PY

      - name: Install Remotion, React and Three.js
        if: inputs.stage == 'render'
        working-directory: remotion
        run: npm install --no-audit --no-fund

      - name: Render animated 3D video with Remotion
        if: inputs.stage == 'render'
        working-directory: remotion
        run: |
          set -euo pipefail
          mkdir -p ../output
          npx remotion render src/index.ts Main ../output/free-animated-3d-explainer.mp4 \
            --props=public/props.json --codec=h264 --gl=swangle --concurrency=2

      - name: Upload finished video and project files
        if: inputs.stage == 'render'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: free-animated-3d-explainer-${{ github.run_number }}
          path: |
            output/free-animated-3d-explainer.mp4
            output/animated-story-*.json
            output/narration-*.mp3
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

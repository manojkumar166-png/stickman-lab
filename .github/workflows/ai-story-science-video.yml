name: AI Story & Science Video Creator

on:
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: stickman-lab-main-writer
  cancel-in-progress: false

jobs:
  create-video:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Cache Whisper model
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/huggingface
          key: whisper-small-${{ runner.os }}-v1
      - name: Install FFmpeg and dependencies
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if sudo apt-get update; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 10))
          done
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install --retries 5 --timeout 60 requests Pillow edge-tts faster-whisper
      - name: Plan, generate scene images, narrate and render
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
          GEMINI_FALLBACK_MODELS: ${{ vars.GEMINI_FALLBACK_MODELS || 'gemini-3.5-flash-lite' }}
        shell: bash
        run: |
          set -euo pipefail
          # One-click default: Gemini invents a fresh topic and creates 48 scenes.
          python -u scripts/ai_story_video.py --topic "" --scenes 48 --voice "en-US-AndrewMultilingualNeural"
      - name: Save used topic history
        continue-on-error: true
        shell: bash
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Publish topic history from an isolated worktree so a concurrent
          # main-branch update cannot disrupt the rendered video workspace.
          STORY_FILE="$(find ai-story-video-output -mindepth 2 -maxdepth 2 -name story.json -type f | sort | tail -n 1)"
          test -n "$STORY_FILE" && test -s "$STORY_FILE"
          SYNC_DIR="$RUNNER_TEMP/story-history-sync"
          git worktree add --detach "$SYNC_DIR" origin/main

          for attempt in 1 2 3 4 5; do
            git -C "$SYNC_DIR" fetch origin main
            git -C "$SYNC_DIR" checkout --detach origin/main

            python - "$GITHUB_WORKSPACE/$STORY_FILE" "$SYNC_DIR/used_story_topics.json" <<'PY'
          import json, sys
          from pathlib import Path

          story = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          history_path = Path(sys.argv[2])
          history = json.loads(history_path.read_text(encoding="utf-8")) if history_path.exists() else []
          if not isinstance(history, list):
              raise SystemExit("used_story_topics.json must contain a JSON list.")

          entry = {
              "title": str(story.get("title", "")).strip(),
              "topic": str(story.get("topic", "")).strip(),
              "description": str(story.get("description", "")).strip(),
          }
          if not all(entry.values()):
              raise SystemExit("Generated story is missing topic-history fields.")

          def key(item):
              return " ".join(str(item.get("topic", "")).casefold().split())

          existing = {key(item) for item in history if isinstance(item, dict)}
          if key(entry) not in existing:
              history.append(entry)
          history_path.write_text(json.dumps(history, ensure_ascii=False, indent=2) + "\\n", encoding="utf-8")
          PY

            git -C "$SYNC_DIR" add used_story_topics.json
            if git -C "$SYNC_DIR" diff --cached --quiet; then
              echo "Topic is already present in the latest main-branch history."
              exit 0
            fi
            git -C "$SYNC_DIR" commit -m "Record completed story topic [skip ci]"
            if git -C "$SYNC_DIR" push origin HEAD:refs/heads/main; then
              echo "Topic history safely published to main."
              exit 0
            fi
            echo "Topic-history push attempt $attempt lost a main-branch race; retrying from latest main."
            sleep "$((attempt * 3))"
          done

          echo "::warning::Video rendering will continue, but topic history could not be published after five attempts."
          exit 0
      - name: Generate and burn karaoke subtitles; name final video
        id: final_video
        env:
          HF_HOME: ${{ runner.temp }}/huggingface
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          root = Path("ai-story-video-output")
          packages = sorted((p for p in root.iterdir() if p.is_dir()), key=lambda p: p.name)
          if not packages:
              raise SystemExit("No output package was created.")
          package = packages[-1]
          story = json.loads((package / "story.json").read_text(encoding="utf-8"))
          title = str(story.get("title", "")).strip()
          if not title:
              raise SystemExit("Story title is missing.")
          safe_title = re.sub(r'[<>:"/\\|?*\r\n]', "", title)
          safe_title = re.sub(r"\s+", " ", safe_title).strip().rstrip(".")[:120].rstrip(".")
          if not safe_title or safe_title in {".", ".."}:
              raise SystemExit("Could not make a safe filename from the story title.")
          final_name = safe_title + ".mp4"
          video = package / "final-video.mp4"
          if not video.is_file() or video.stat().st_size < 100000:
              raise SystemExit("Final video is missing or too small.")
          captions = package / "karaoke-captions.ass"
          subtitled = package / "subtitled-final.mp4"
          import sys
          sys.path.insert(0, str(Path("science-channel/scripts").resolve()))
          from karaoke_subtitles import generate_karaoke_ass
          words = generate_karaoke_ass(str(video), str(captions), 1280, 720)
          print(f"Generated karaoke captions for {words} timed words.")
          subprocess.run([
              "ffmpeg", "-y", "-hide_banner", "-loglevel", "error",
              "-i", str(video),
              "-vf", f"subtitles={captions.as_posix()}:fontsdir=/usr/share/fonts/truetype/dejavu",
              "-map", "0:v:0", "-map", "0:a:0",
              "-c:v", "libx264", "-preset", "veryfast", "-crf", "21",
              "-c:a", "copy", "-shortest", "-movflags", "+faststart", str(subtitled)
          ], check=True)
          if not subtitled.is_file() or subtitled.stat().st_size < 100000:
              raise SystemExit("Subtitled final video is missing or too small.")
          subtitled.replace(video)
          captions.unlink(missing_ok=True)
          destination = Path("ai-story-video-output") / final_name
          if destination.exists():
              destination.unlink()
          video.replace(destination)
          # Keep package internals for workflow processing, but deliver only the final MP4.
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"video={destination.as_posix()}\n")
              output.write(f"filename={final_name}\n")
              display_title = " ".join(title.split())
              output.write(f"title={display_title}\n")
          print(f"Final video ready: {destination}")
          PY
      - name: Resolve artifact
        id: artifact
        env:
          FINAL_VIDEO: ${{ steps.final_video.outputs.video }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          video = Path(os.environ["FINAL_VIDEO"])
          if not video.is_file():
              raise SystemExit(f"Final video not found: {video}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"name={video.stem}\n")
              f.write(f"video={video.as_posix()}\n")
          PY

      - name: Upload final video only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ steps.artifact.outputs.video }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Send final video to Telegram
        continue-on-error: true
        uses: PonomarevDA/telegram-upload@b6a8f85231f9a39d652fa1cc64f8557e0a6519ea # v1
        with:
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          files: ${{ steps.artifact.outputs.video }}
          message: "🎬 AI Story & Science Video Creator — created by workflow: AI Story & Science Video Creator\nTitle: ${{ steps.final_video.outputs.title }}"
      - name: Alert Telegram when workflow fails
        if: failure()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WORKFLOW_NAME: ${{ github.workflow }}
          JOB_NAME: ${{ github.job }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${TELEGRAM_BOT_TOKEN:-}" || -z "${TELEGRAM_CHAT_ID:-}" ]]; then
            echo "Telegram alert skipped: TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID is not configured."
            exit 0
          fi
          MESSAGE="$(printf '%s\n' '🚨 GitHub Actions workflow failed' "Workflow: $WORKFLOW_NAME" "Job: $JOB_NAME" "Branch: $BRANCH_NAME" "Run: #$RUN_NUMBER" "$RUN_URL")"
          curl --fail --silent --show-error --connect-timeout 15 --max-time 30 --retry 3 --retry-all-errors --retry-delay 2 \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${MESSAGE}"


name: AI Story & Science Video Creator

on:
  workflow_dispatch:
  schedule:
    - cron: "30 5 * * *" # Daily at 11:00 AM IST

permissions:
  contents: write
  actions: write
concurrency:
  group: stickman-lab-main-writer
  cancel-in-progress: false

jobs:
  create-video:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
      - name: Validate required secrets before expensive setup
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          for name in TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required repository secret $name is missing. Configure it before running AI Story & Science Video Creator."
              exit 1
            fi
          done
      - name: Restore saved science-video progress
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ai-story-video-output
          REMOTE_PROGRESS="$(git ls-remote --heads origin refs/heads/ai-story-science-progress)"
          if [[ -n "$REMOTE_PROGRESS" ]]; then
            git fetch origin +refs/heads/ai-story-science-progress:refs/remotes/origin/ai-story-science-progress
            git archive origin/ai-story-science-progress progress | tar -x -C .
            if [[ -d progress/ai-story-video-output ]]; then
              cp -a progress/ai-story-video-output/. ai-story-video-output/
              echo "Restored science-video checkpoint."
            fi
            rm -rf progress
          else
            echo "No previous science-video checkpoint."
          fi
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Cache Whisper model
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/huggingface
          key: faster-whisper-small-${{ runner.os }}-v1
      - name: Install FFmpeg and dependencies
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if sudo apt-get update; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 10))
          done
          for attempt in 1 2 3; do
            if sudo apt-get install -y ffmpeg fonts-dejavu-core; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 10))
          done
          python -m pip install --retries 5 --timeout 60 --upgrade pip
          python -m pip install --retries 5 --timeout 60 requests Pillow edge-tts gTTS faster-whisper
      - name: Plan, generate scene images, narrate and render
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'openai/gpt-oss-120b' }}
          KILO_MODEL: ${{ vars.KILO_MODEL || 'kilo-auto/free' }}
          KILO_FALLBACK_MODELS: ${{ vars.KILO_FALLBACK_MODELS || 'nvidia/nemotron-3.5-lightning:free,openrouter/free' }}
          OVH_MODEL: ${{ vars.OVH_MODEL || 'Qwen3.5-397B-A17B' }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
          GEMINI_FALLBACK_MODELS: ${{ vars.GEMINI_FALLBACK_MODELS || 'gemini-3.5-flash-lite' }}
        shell: bash
        run: |
          set -euo pipefail
          # One-click default: Gemini invents a fresh topic and creates 48 scenes.
          python -u scripts/ai_story_video.py --topic "" --scenes 48 --voice "en-US-AndrewMultilingualNeural"
      - name: Generate karaoke subtitles and name final video
        id: final_video
        env:
          HF_HOME: ${{ runner.temp }}/huggingface
          KARAOKE_WHISPER_BACKEND: faster-whisper
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path

          def run_ffmpeg(command):
              last_error = None
              for attempt in range(1, 4):
                  try:
                      subprocess.run(command, check=True, timeout=900)
                      return
                  except (subprocess.CalledProcessError, subprocess.TimeoutExpired) as exc:
                      last_error = exc
                      print(f"FFmpeg attempt {attempt}/3 failed: {exc}", flush=True)
                      if attempt < 3:
                          import time
                          time.sleep(attempt * 5)
              if "-c:v" in command and "libx264" in command:
                  fallback, skip = [], False
                  for arg in command:
                      if skip:
                          skip = False
                          continue
                      if arg in ("-preset", "-crf", "-tune"):
                          skip = True
                      elif arg == "libx264":
                          fallback.extend(["mpeg4", "-q:v", "5"])
                      else:
                          fallback.append(arg)
                  print("H.264 failed after 3 attempts; trying MPEG-4 encoder.", flush=True)
                  subprocess.run(fallback, check=True, timeout=900)
                  return
              raise RuntimeError(f"FFmpeg failed after 3 attempts: {last_error}") from last_error

          root = Path("ai-story-video-output")
          packages = []
          for candidate in root.iterdir():
              story_file = candidate / "story.json"
              if not candidate.is_dir() or not story_file.is_file():
                  continue
              try:
                  saved = json.loads(story_file.read_text(encoding="utf-8"))
              except (OSError, ValueError):
                  continue
              if saved.get("completed") is not True:
                  packages.append((candidate.name, candidate, saved))
          if not packages:
              raise SystemExit("No unfinished output package was created.")

          _, package, story = max(packages, key=lambda item: item[0])
          title = str(story.get("title", "")).strip()
          if not title:
              raise SystemExit("Story title is missing.")

          safe_title = re.sub(r'[<>:"/\\|?*\r\n]', "", title)
          safe_title = re.sub(r"\s+", " ", safe_title).strip().rstrip(".")[:120].rstrip(".")
          if not safe_title or safe_title in {".", ".."}:
              raise SystemExit("Could not make a safe filename from the story title.")

          video = package / "final-video.mp4"
          if not video.is_file() or video.stat().st_size < 100000:
              raise SystemExit("Final video is missing or too small.")

          work = package / "subtitle-work"
          work.mkdir(exist_ok=True)
          audio = work / "narration-for-whisper.mp3"
          captions = work / "karaoke-captions.ass"
          run_ffmpeg([
              "ffmpeg", "-y", "-hide_banner", "-loglevel", "error",
              "-i", str(video), "-vn", "-ac", "1", "-ar", "24000", str(audio)
          ])

          import sys
          sys.path.insert(0, str(Path("science-channel/scripts").resolve()))
          from karaoke_subtitles import generate_karaoke_ass
          config = json.loads(Path("science-channel/settings.json").read_text(encoding="utf-8"))
          words = generate_karaoke_ass(
              str(audio), str(captions), int(config["width"]), int(config["height"])
          )
          if not captions.is_file() or captions.stat().st_size == 0:
              raise SystemExit("Karaoke subtitle generation did not produce an ASS file.")

          final_video = root / f"{safe_title}.mp4"
          run_ffmpeg([
              "ffmpeg", "-y", "-hide_banner", "-loglevel", "error",
              "-i", str(video),
              "-vf", f"subtitles={captions}:fontsdir=/usr/share/fonts/truetype/dejavu",
              "-map", "0:v:0", "-map", "0:a:0",
              "-c:v", "libx264", "-preset", "veryfast", "-crf", "21",
              "-c:a", "aac", "-b:a", "192k", "-shortest",
              "-movflags", "+faststart", str(final_video)
          ])
          if not final_video.is_file() or final_video.stat().st_size < 100000:
              raise SystemExit("Final subtitled video is missing or too small.")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"video={final_video.as_posix()}\n")
              output.write(f"filename={final_video.name}\n")
              output.write(f"title={' '.join(title.split())}\n")
              output.write(f"package={package.as_posix()}\n")
          print(f"Burned karaoke captions for {words} timed words into {final_video}.")
          PY
      - name: Save used topic history
        shell: bash
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Publish topic history from an isolated worktree so a concurrent
          # main-branch update cannot disrupt the rendered video workspace.
          STORY_FILE="$(python - <<'PY'
          import json
          from pathlib import Path
          root = Path("ai-story-video-output")
          candidates = []
          for package in root.iterdir():
              story_file = package / "story.json"
              if not package.is_dir() or not story_file.is_file():
                  continue
              try:
                  story = json.loads(story_file.read_text(encoding="utf-8"))
              except (OSError, ValueError):
                  continue
              if story.get("completed") is not True:
                  candidates.append((package.name, story_file))
          print(max(candidates, key=lambda item: item[0])[1] if candidates else "")
          PY
          )"
          test -n "$STORY_FILE" && test -s "$STORY_FILE" || { echo "No unfinished story package was found for topic-history publication."; exit 1; }
          SYNC_DIR="$RUNNER_TEMP/story-history-sync"
          git worktree add --detach "$SYNC_DIR" origin/main

          for attempt in 1 2 3 4 5; do
            if ! git -C "$SYNC_DIR" fetch origin main; then
              echo "Topic-history fetch attempt $attempt failed; retrying."
              if [ "$attempt" -lt 5 ]; then sleep "$((attempt * 3))"; fi
              continue
            fi
            if ! git -C "$SYNC_DIR" checkout --detach origin/main; then
              echo "Could not reset isolated history worktree to origin/main."
              exit 1
            fi

            python - "$GITHUB_WORKSPACE/$STORY_FILE" "$SYNC_DIR/used_story_topics.json" <<'PY'
          import json, sys
          from pathlib import Path

          story = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          history_path = Path(sys.argv[2])
          history = json.loads(history_path.read_text(encoding="utf-8")) if history_path.exists() else []
          if not isinstance(history, list):
              raise SystemExit("used_story_topics.json must contain a JSON list.")

          entry = {
              "title": str(story.get("title", "")).strip(),
              "topic": str(story.get("topic", "")).strip(),
              "description": str(story.get("description", "")).strip(),
          }
          if not all(entry.values()):
              raise SystemExit("Generated story is missing topic-history fields.")

          def key(item):
              return " ".join(str(item.get("topic", "")).casefold().split())

          existing = {key(item) for item in history if isinstance(item, dict)}
          if key(entry) not in existing:
              history.append(entry)
          history_path.write_text(json.dumps(history, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

            git -C "$SYNC_DIR" add used_story_topics.json
            if git -C "$SYNC_DIR" diff --cached --quiet; then
              echo "Topic is already present in the latest main-branch history."
              exit 0
            fi
            git -C "$SYNC_DIR" commit -m "Record completed story topic [skip ci]"
            if git -C "$SYNC_DIR" push origin HEAD:refs/heads/main; then
              echo "Topic history safely published to main."
              exit 0
            fi
            echo "Topic-history push attempt $attempt lost a main-branch race; retrying from latest main."
            sleep "$((attempt * 3))"
          done

          echo "::error::Topic history could not be published after five attempts. Failing safely so the story checkpoint is preserved and this run can be retried."
          exit 1
      - name: Upload final video
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.final_video.outputs.filename }}
          path: ${{ steps.final_video.outputs.video }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 2
      - name: Send final video to Telegram
        id: telegram
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CAPTION: "🎬 AI Story & Science Video Creator — created by workflow: AI Story & Science Video Creator | Title: ${{ steps.final_video.outputs.title }}"
          VIDEO_PATH: ${{ steps.final_video.outputs.video }}
        shell: bash
        run: |
          set -euo pipefail
          python -u scripts/send_telegram_video.py "$VIDEO_PATH"
      - name: Require successful Telegram delivery
        if: steps.telegram.outcome != 'success'
        shell: bash
        run: |
          echo "::error::The video artifact was created, but Telegram delivery failed. Existing scene/story progress will be preserved for a safe retry."
          exit 1
      - name: Mark science story complete after successful delivery
        env:
          PACKAGE_PATH: ${{ steps.final_video.outputs.package }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          package = Path(os.environ['PACKAGE_PATH'])
          story_path = package / 'story.json'
          story = json.loads(story_path.read_text(encoding='utf-8'))
          story['completed'] = True
          temporary = story_path.with_name(story_path.name + '.tmp')
          temporary.write_text(json.dumps(story, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          temporary.replace(story_path)
          print(f'Marked delivered story complete: {story_path}')
          PY
      - name: Clear science-video progress after success
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_PROGRESS="$(git ls-remote --heads origin refs/heads/ai-story-science-progress)"
          if [[ -z "$REMOTE_PROGRESS" ]]; then
            echo "No science-video checkpoint to clear."
            exit 0
          fi
          for attempt in 1 2 3; do
            if git push origin --delete ai-story-science-progress; then
              echo "Completed science-video checkpoint cleared."
              exit 0
            fi
            echo "Checkpoint cleanup attempt $attempt failed."
            sleep $((attempt * 3))
          done
          echo "::error::Could not clear the completed checkpoint after three attempts; saving the completed state before retrying."
          exit 1
      - name: Save science-video progress after failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          SYNC_DIR="$RUNNER_TEMP/science-progress-worktree"
          REMOTE_PROGRESS="$(git ls-remote --heads origin refs/heads/ai-story-science-progress)"
          if [[ -n "$REMOTE_PROGRESS" ]]; then
            git fetch origin +refs/heads/ai-story-science-progress:refs/remotes/origin/ai-story-science-progress
            git worktree add -B ai-story-science-progress "$SYNC_DIR" origin/ai-story-science-progress
          else
            git worktree add --detach "$SYNC_DIR" HEAD
            git -C "$SYNC_DIR" switch --orphan ai-story-science-progress
            git -C "$SYNC_DIR" rm -rf . >/dev/null 2>&1 || true
          fi
          rm -rf "$SYNC_DIR/progress/ai-story-video-output"
          mkdir -p "$SYNC_DIR/progress/ai-story-video-output"
          if [[ -d ai-story-video-output ]]; then
            cp -a ai-story-video-output/. "$SYNC_DIR/progress/ai-story-video-output/"
          fi
          git -C "$SYNC_DIR" add -A progress
          if git -C "$SYNC_DIR" diff --cached --quiet; then
            echo "No new science-video progress to checkpoint."
            exit 0
          fi
          git -C "$SYNC_DIR" -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Checkpoint science video generation"
          for attempt in 1 2 3 4 5; do
            if git -C "$SYNC_DIR" push --force origin HEAD:refs/heads/ai-story-science-progress; then
              echo "Science-video progress checkpoint saved."
              exit 0
            fi
            echo "Checkpoint push attempt $attempt failed."
            if [ "$attempt" -lt 5 ]; then sleep $((attempt * 3)); fi
          done
          echo "Could not save science-video checkpoint after five attempts."
          exit 1
      - name: Alert Telegram when workflow fails
        if: failure()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WORKFLOW_NAME: ${{ github.workflow }}
          JOB_NAME: ${{ github.job }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${TELEGRAM_BOT_TOKEN:-}" || -z "${TELEGRAM_CHAT_ID:-}" ]]; then
            echo "Telegram alert skipped: TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID is not configured."
            exit 0
          fi
          MESSAGE="$(printf '%s\n' '🚨 GitHub Actions workflow failed' "Workflow: $WORKFLOW_NAME" "Job: $JOB_NAME" "Branch: $BRANCH_NAME" "Run: #$RUN_NUMBER" "$RUN_URL")"
          curl --fail --silent --show-error --connect-timeout 15 --max-time 30 --retry 3 --retry-all-errors --retry-delay 2 \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${MESSAGE}"


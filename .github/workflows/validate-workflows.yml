name: Validate GitHub Actions workflows

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "cloudflare-worker.js"
      - "science-channel/scripts/**"
      - "scripts/**"
      - "ai-roast-studio/**"
      - "main_ai.py"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "cloudflare-worker.js"
      - "science-channel/scripts/**"
      - "scripts/**"
      - "main_ai.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: Check workflow syntax and expressions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run actionlint
        uses: reviewdog/action-actionlint@619a81ec64ff8c0211cd6146eb2b21e8f1d7f440 # v1
        with:
          actionlint_flags: "-color"
      - name: Check Python syntax for workflow entry points
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Compile workflow support scripts
        run: |
          set -euo pipefail
          python -m compileall -q \
            science-channel/scripts \
            scripts \
            ai-roast-studio \
            main_ai.py
      - name: Check Cloudflare Worker JavaScript syntax
        run: node --check cloudflare-worker.js

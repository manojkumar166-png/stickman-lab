name: Validate GitHub Actions workflows

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
  pull_request:
    paths:
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: Check workflow syntax and expressions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          actionlint_flags: "-color"
      - name: Check Python syntax for workflow entry points
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile workflow support scripts
        run: |
          set -euo pipefail
          python -m compileall -q \
            science-channel/scripts \
            scripts \
            main_ai.py
